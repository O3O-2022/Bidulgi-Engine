<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Bidulgi Engine icon C: Mark</title>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f27"/>
      <stop offset="1" stop-color="#0d1015"/>
    </linearGradient>
    <linearGradient id="c-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3bfce"/>
      <stop offset=".55" stop-color="#7d8ba0"/>
      <stop offset="1" stop-color="#5d6b80"/>
    </linearGradient>
    <linearGradient id="c-iri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22b8a6"/>
      <stop offset=".5" stop-color="#3a7fd0"/>
      <stop offset="1" stop-color="#9257d0"/>
    </linearGradient>
    <clipPath id="c-clip"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="c-circle"><circle cx="256" cy="228" r="132"/></clipPath>
  </defs>
  <g clip-path="url(#c-clip)">
    <rect width="512" height="512" fill="url(#c-bg)"/>
    <!-- head disc with iridescent lower band -->
    <circle cx="256" cy="228" r="132" fill="url(#c-head)"/>
    <g clip-path="url(#c-circle)">
      <path d="M100 300 C170 276 342 276 412 300 V380 H100 Z" fill="url(#c-iri)" opacity=".95"/>
    </g>
    <!-- eyes -->
    <circle cx="208" cy="196" r="13" fill="#ee7330"/>
    <circle cx="304" cy="196" r="13" fill="#ee7330"/>
    <!-- lips -->
    <path d="M196 248 C214 226 242 228 256 238 C270 228 298 226 316 248 C298 274 214 274 196 248 Z" fill="#f08a6a"/>
    <path d="M201 248 C226 254 286 254 311 248" stroke="#c4563f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- feet -->
    <g fill="#f08a6a">
      <rect x="208" y="352" width="18" height="52" rx="8"/>
      <rect x="286" y="352" width="18" height="52" rx="8"/>
      <path d="M168 436 C164 410 182 394 212 394 C240 394 250 410 246 436 Z"/>
      <circle cx="173" cy="437" r="10"/><circle cx="191" cy="441" r="9"/><circle cx="208" cy="442" r="8"/><circle cx="224" cy="441" r="7.5"/><circle cx="238" cy="438" r="7"/>
      <path d="M266 436 C262 410 272 394 300 394 C330 394 348 410 344 436 Z"/>
      <circle cx="339" cy="437" r="10"/><circle cx="321" cy="441" r="9"/><circle cx="304" cy="442" r="8"/><circle cx="288" cy="441" r="7.5"/><circle cx="274" cy="438" r="7"/>
    </g>
  </g>
</svg>
