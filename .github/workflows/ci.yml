name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies (SDL3, FreeType, yyjson)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        # No -G: CMake picks the newest Visual Studio on the runner (2022 locally, newer on hosted images).
        run: cmake -S . -B build -A x64

      - name: Build Debug + Release (zero warnings in engine code)
        shell: pwsh
        run: |
          $fail = $false
          foreach ($cfg in 'Debug', 'Release') {
            cmake --build build --config $cfg --target BidulgiEditor BidulgiTests -- /m /v:minimal 2>&1 | Tee-Object -FilePath "build-$cfg.log"
            if ($LASTEXITCODE -ne 0) { Write-Error "$cfg build failed"; exit 1 }
            # Warnings from our own sources only (third-party code under build/_deps is excluded).
            $warn = Select-String -Path "build-$cfg.log" -Pattern 'warning C\d+' | Where-Object { $_.Line -notmatch '_deps' }
            if ($warn) { $warn | ForEach-Object { Write-Host "::warning::$($_.Line)" }; $fail = $true }
          }
          if ($fail) { Write-Error "Engine code must build with zero warnings (/W4)"; exit 1 }

      # Hosted runners have no GPU: use Mesa's software OpenGL (llvmpipe, GL 4.5) next to the exe.
      - name: Install Mesa software OpenGL
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' -Headers @{ 'User-Agent' = 'ci' }
          $asset = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Write-Host "Mesa: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          foreach ($cfg in 'Debug', 'Release') { Copy-Item mesa/x64/*.dll "build/$cfg/" -Force }

      - name: Smoke tests
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
        run: |
          function Invoke-Editor([string]$cfg, [hashtable]$envs, [int]$frames) {
            foreach ($k in $envs.Keys) { Set-Item "Env:$k" $envs[$k] }
            $p = Start-Process "build/$cfg/BidulgiEditor.exe" -ArgumentList '--frames', $frames -WorkingDirectory $PWD -PassThru -Wait
            foreach ($k in $envs.Keys) { Remove-Item "Env:$k" -ErrorAction SilentlyContinue }
            $log = Get-Content Bidulgi.log -Raw -Encoding utf8
            Write-Host "----- $cfg $($envs.Keys -join ',') (exit $($p.ExitCode))"; Write-Host $log
            if ($p.ExitCode -ne 0) { throw "editor exited with $($p.ExitCode)" }
            return $log
          }
          $errors = @()

          # 1) Editor screen renders, tokens and font load, UI draws in one call
          $log = Invoke-Editor 'Release' @{ BDG_SCREENSHOT = 'ci-editor.png' } 30
          if ($log -notmatch 'tokens: \d+ colors') { $errors += 'design tokens not loaded' }
          if ($log -notmatch 'frame stats: .*draws=1') { $errors += 'editor frame is not a single draw call' }
          if ($log -match '\[error\]') { $errors += 'errors in editor log' }
          # Start-up time (queue 2-3b): shown on the run page; software GL on CI is much slower than a GPU
          if ($log -match '(startup: .*)') { Write-Host "::notice::$($Matches[1])" }
          if ($log -match '(perf: startup_to_first_frame_ms=\d+[^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }

          # 2) UI self-test: click, focus, Korean text input, IME composition
          $log = Invoke-Editor 'Debug' @{ BDG_SCREEN = 'gallery'; BDG_UI_SELFTEST = '1' } 20
          if ($log -notmatch 'clicks\(Apply\)=1') { $errors += 'button click failed' }
          if ($log -notmatch 'field\.speed="한글 입력" composing="ㅋ"') { $errors += 'text input / IME self-test failed' }

          # 3) 10k rects in one draw call
          $log = Invoke-Editor 'Release' @{ BDG_BATCH_STRESS = '1' } 10
          if ($log -notmatch 'quads=10000 flushes=1 draws=1') { $errors += 'batch stress test failed' }

          # 4) Bug report folder is created (no browser in CI)
          $log = Invoke-Editor 'Release' @{ BDG_BUG_TEST = '1' } 10
          if ($log -notmatch 'bug report: ') { $errors += 'bug report not written' }
          $report = Get-ChildItem BugReports -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($report) {
            foreach ($f in Get-ChildItem $report.FullName -File -Exclude *.png) {
              if ((Get-Content $f.FullName -Raw -Encoding utf8) -match [regex]::Escape($env:USERNAME)) { $errors += "user name found in $($f.Name)" }
            }
            $png = Get-Item (Join-Path $report.FullName 'screenshot.png')
            if ($png.Length -gt 500KB) { $errors += "bug report screenshot is $([int]($png.Length / 1KB)) KB (limit 500)" }
          }

          # 5) Idle editor sleeps (queue 0-13): almost no frames while idle, wakes at once on an event
          $env:BDG_IDLE_TEST = '3'
          $log = Invoke-Editor 'Release' @{} 0
          Remove-Item Env:BDG_IDLE_TEST
          if ($log -match 'idle: .*frames=(\d+) .*wake_latency_ms=([\d.]+)') {
            if ([int]$Matches[1] -gt 6) { $errors += "idle editor kept drawing ($($Matches[1]) frames in 3 s)" }
            if ([double]$Matches[2] -gt 50) { $errors += "idle wake-up too slow ($($Matches[2]) ms)" }
          } else { $errors += 'idle test line missing' }

          # 6) Docking (queue 1-1): splitter drag + tab move, then the saved layout comes back after a restart
          $env:BDG_LAYOUT = "$PWD/ci-layout.jsonl"
          Remove-Item $env:BDG_LAYOUT -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_DOCK_TEST = '1' } 10
          if ($log -notmatch 'dock test: hierarchy_w ([\d.]+) -> ([\d.]+)  console_leaf_tabs=1') { $errors += 'dock test line missing or tab not moved' }
          elseif ([math]::Abs(([double]$Matches[2] - [double]$Matches[1]) - 100) -gt 1) { $errors += "splitter drag moved $([double]$Matches[2] - [double]$Matches[1]) instead of 100" }
          $final1 = if ($log -match 'dock final: (.*)') { $Matches[1].Trim() } else { '' }
          $log = Invoke-Editor 'Release' @{} 5
          $final2 = if ($log -match 'dock final: (.*)') { $Matches[1].Trim() } else { '' }
          if ($log -notmatch 'dock: layout loaded' -or $final1 -ne $final2 -or -not $final1) { $errors += "dock layout not restored ('$final1' vs '$final2')" }
          Remove-Item Env:BDG_LAYOUT

          # 7) Command bus (queue 1-3): Inspector edit -> Ctrl+Z -> Ctrl+Y, selection; the saved log replays to the same scene
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_CMD_TEST = '1'; BDG_CMD_LOG = "$PWD/ci-commands.jsonl"; BDG_SCENE_DUMP = "$PWD/ci-scene1.jsonl" } 18
          if ($log -notmatch 'cmd test: edit=\[3,4,5\] undo=\[0,1,0\] redo=\[3,4,5\] maxHealth=100 undo_depth=1 selected=g9 light_card=1') { $errors += 'command bus test failed' }
          if ($log -notmatch 'history: Player: Transform.position = \[3,4,5\] \| Player: Health.maxHealth = 250 \(undone\)') { $errors += 'history panel jump failed' }
          $env:BDG_SCENE_DUMP = "$PWD/ci-scene2.jsonl"
          Start-Process build/Release/BidulgiEditor.exe -ArgumentList '--frames', '3', '--replay', "$PWD/ci-commands.jsonl" -WorkingDirectory $PWD -Wait
          Remove-Item Env:BDG_SCENE_DUMP
          if ((Get-Content Bidulgi.log -Raw -Encoding utf8) -notmatch 'replay: \d+ commands') { $errors += 'replay did not run' }
          if ((Get-Content ci-scene1.jsonl -Raw) -ne (Get-Content ci-scene2.jsonl -Raw)) { $errors += 'replayed command log gives a different scene' }
          Remove-Item Env:BDG_LAYOUT

          # 8) Crash report (queue 1-4b): a deliberate crash writes a minidump; the next start offers to report it
          $env:BDG_CRASH_TEST = '1'
          $p = Start-Process build/Release/BidulgiEditor.exe -ArgumentList '--frames', '10' -WorkingDirectory $PWD -PassThru -Wait
          Remove-Item Env:BDG_CRASH_TEST
          $crash = Get-ChildItem BugReports -Directory -Filter 'crash-*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $crash -or -not (Test-Path "$($crash.FullName)/crash.dmp") -or -not (Test-Path BugReports/pending-crash.txt)) { $errors += "crash report not written (exit $($p.ExitCode))" }
          $log = Invoke-Editor 'Release' @{} 5
          if ($log -notmatch 'crash: the previous session crashed' -or $log -notmatch 'crash: report button shown') { $errors += 'crash not offered on the next start' }

          # 9) Fault injection (queue 1-4c): a crashing panel and a failed check; the editor survives and autosaves
          $log = Invoke-Editor 'Release' @{ BDG_FAULT_TEST = '1' } 10
          if ($log -notmatch 'fault test: guard_failures=1 check_failures=1 frames=10 survived=1' -or $log -notmatch 'autosave: ') { $errors += 'fault injection test failed' }

          # 10) Shortcuts (queue 1-5): first-run banner -> Unity keys; Unreal preset -> other keys for the same actions
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $env:BDG_SHORTCUTS = "$PWD/ci-shortcuts.jsonl"
          Remove-Item $env:BDG_SHORTCUTS -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SHORTCUT_TEST = '1' } 14
          if ($log -notmatch 'shortcut test: banner_shown=1 unity_play=1 unreal_play=0 objects=10 preset=unreal conflicts=0 saved=1') { $errors += 'shortcut test failed' }
          $log = Invoke-Editor 'Release' @{} 3
          if ($log -notmatch 'shortcuts: preset unreal loaded') { $errors += 'shortcut preset not kept' }
          Remove-Item Env:BDG_SHORTCUTS, Env:BDG_LAYOUT

          # 11) Accessibility (queue 1-6): a UI Automation client reads the focused button; Ctrl+F6 moves to the next panel
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_A11Y_TEST = '1' } 8
          if ($log -notmatch 'a11y test: focused_name=Add Component control=Button children=(\d+) next_panel=h\.scene') { $errors += 'accessibility test failed' }
          elseif ([int]$Matches[1] -lt 10) { $errors += "accessibility tree too small ($($Matches[1]) elements)" }
          Remove-Item Env:BDG_LAYOUT

          # 12) Scene model (queue 2-1): drag Weapon onto "Main" in the Hierarchy; it keeps its world position
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_DRAG_TEST = '1' } 6
          if ($log -notmatch 'drag test: weapon_parent="" world_kept=1 undo_depth=1') { $errors += 'hierarchy drag (keep world) failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 13) Scene files (queue 2-2): Ctrl+S saves; opening that file and saving again gives the same bytes
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $env:BDG_SCENE_FILE = "$PWD/ci-test.scene"
          Remove-Item $env:BDG_SCENE_FILE -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SAVE_TEST = '1' } 5
          if ($log -notmatch 'scene: saved .* \(9 objects\)') { $errors += 'Ctrl+S did not save the scene' }
          Copy-Item ci-test.scene ci-test-first.scene
          $log = Invoke-Editor 'Release' @{ BDG_SAVE_TEST = '1' } 5
          if ($log -notmatch 'scene: opened') { $errors += 'saved scene did not open' }
          if ((Get-FileHash ci-test.scene).Hash -ne (Get-FileHash ci-test-first.scene).Hash) { $errors += 'save -> open -> save changed the file' }
          Remove-Item Env:BDG_SCENE_FILE, Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 14) Asset database (queue 2-3): .meta files, a move in the editor and one outside it keep GUIDs and references
          $assets = "$PWD/ci-assets"
          Remove-Item -Recurse -Force $assets -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $assets | Out-Null
          foreach ($n in 'Knight', 'Sword', 'Crystal', 'Plane') { Set-Content "$assets/$n.glb" "glb-$n" -NoNewline }
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = $assets; BDG_ASSET_TEST = '1' } 120
          if ($log -notmatch 'asset test: knight_guid_kept=1 player_mesh="Characters/Knight.glb" weapon_mesh="Weapons/Sword.glb" watcher=1 orphans=0 assets=4') { $errors += 'asset database test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'All smoke tests passed.'

      - name: Unit tests
        shell: pwsh
        run: |
          build/Release/BidulgiTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Design parity (tokens + layout vs design-system previews)
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
          PYTHONIOENCODING: utf-8
        run: python tools/ui_compare/compare.py --exe build/Release/BidulgiEditor.exe

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: |
            ci-editor.png
            Bidulgi.log
            build-*.log
            BugReports/
          if-no-files-found: ignore

  asan:
    name: Unit tests + fuzzing under AddressSanitizer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (BDG_ASAN=ON)
        run: cmake -S . -B build-asan -A x64 -DBDG_ASAN=ON

      - name: Build tests
        run: cmake --build build-asan --config Release --target BidulgiTests -- /m /v:minimal

      - name: Run tests (ASan runtime from the MSVC toolset)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dll = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Sort-Object FullName | Select-Object -Last 1
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          build-asan/Release/BidulgiTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
