name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # main pushes always finish (each commit gets a result)

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 75  # build ~16 min + smoke tests ~25 min on software OpenGL (more as features land)
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies (SDL3, FreeType, yyjson)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: .NET SDK (C# scripting, queue 4-1)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure
        # No -G: CMake picks the newest Visual Studio on the runner (2022 locally, newer on hosted images).
        run: cmake -S . -B build -A x64

      - name: Build Debug + Release (zero warnings in engine code)
        shell: pwsh
        run: |
          $fail = $false
          foreach ($cfg in 'Debug', 'Release') {
            cmake --build build --config $cfg --target BidulgiEditor BidulgiTests bdg -- /m /v:minimal 2>&1 | Tee-Object -FilePath "build-$cfg.log"
            if ($LASTEXITCODE -ne 0) { Write-Error "$cfg build failed"; exit 1 }
            # Warnings from our own sources only (third-party code under build/_deps is excluded).
            $warn = Select-String -Path "build-$cfg.log" -Pattern 'warning C\d+' | Where-Object { $_.Line -notmatch '_deps' }
            if ($warn) { $warn | ForEach-Object { Write-Host "::warning::$($_.Line)" }; $fail = $true }
          }
          if ($fail) { Write-Error "Engine code must build with zero warnings (/W4)"; exit 1 }

      # Hosted runners have no GPU: use Mesa's software OpenGL (llvmpipe, GL 4.5) next to the exe.
      - name: Install Mesa software OpenGL
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest' -Headers @{ 'User-Agent' = 'ci' }
          $asset = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          Write-Host "Mesa: $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          foreach ($cfg in 'Debug', 'Release') { Copy-Item mesa/x64/*.dll "build/$cfg/" -Force }

      - name: Smoke tests
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
        run: |
          function Invoke-Editor([string]$cfg, [hashtable]$envs, [int]$frames) {
            foreach ($k in $envs.Keys) { Set-Item "Env:$k" $envs[$k] }
            $p = Start-Process "build/$cfg/BidulgiEditor.exe" -ArgumentList '--frames', $frames -WorkingDirectory $PWD -PassThru -Wait
            foreach ($k in $envs.Keys) { Remove-Item "Env:$k" -ErrorAction SilentlyContinue }
            $log = Get-Content Bidulgi.log -Raw -Encoding utf8
            Write-Host "----- $cfg $($envs.Keys -join ',') (exit $($p.ExitCode))"; Write-Host $log
            if ($p.ExitCode -ne 0) { throw "editor exited with $($p.ExitCode)" }
            return $log
          }
          $errors = @()

          # 1) Editor screen renders, tokens and font load, UI draws in one call
          $log = Invoke-Editor 'Release' @{ BDG_SCREENSHOT = 'ci-editor.png' } 30
          if ($log -notmatch 'tokens: \d+ colors') { $errors += 'design tokens not loaded' }
          # UI review B5: the tokens keep text at 4.5:1 on its surfaces and input borders at 3:1 (Tests/ThemeContrastTests.cpp)
          $contrast = (& build/Release/BidulgiTests.exe 'design tokens' 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { $errors += "design token contrast: $contrast" }
          if ($log -notmatch 'frame stats: .*ui_draws=1 ') { $errors += 'editor UI is not a single draw call' }
          if ($log -notmatch 'frame stats: .*draws3d=[1-9]') { $errors += 'scene view drew nothing in 3D' }
          if ($log -match '\[error\]') { $errors += 'errors in editor log' }
          # Start-up time (queue 2-3b): shown on the run page; software GL on CI is much slower than a GPU
          if ($log -match '(startup: .*)') { Write-Host "::notice::$($Matches[1])" }
          if ($log -match '(perf: startup_to_first_frame_ms=\d+[^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }

          # 2) UI self-test: click, focus, Korean text input, IME composition
          $log = Invoke-Editor 'Debug' @{ BDG_SCREEN = 'gallery'; BDG_UI_SELFTEST = '1' } 20
          if ($log -notmatch 'clicks\(Apply\)=1') { $errors += 'button click failed' }
          if ($log -notmatch 'field\.speed="한글 입력" composing="ㅋ"') { $errors += 'text input / IME self-test failed' }

          # 3) 10k rects in one draw call
          $log = Invoke-Editor 'Release' @{ BDG_BATCH_STRESS = '1' } 10
          if ($log -notmatch 'quads=10000 flushes=1 ui_draws=1 draws3d=0 draws=1 ') { $errors += 'batch stress test failed' }

          # 4) Bug report folder is created (no browser in CI)
          $log = Invoke-Editor 'Release' @{ BDG_BUG_TEST = '1' } 10
          if ($log -notmatch 'bug report: ') { $errors += 'bug report not written' }
          $report = Get-ChildItem BugReports -Directory | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($report) {
            foreach ($f in Get-ChildItem $report.FullName -File -Exclude *.png) {
              if ((Get-Content $f.FullName -Raw -Encoding utf8) -match [regex]::Escape($env:USERNAME)) { $errors += "user name found in $($f.Name)" }
            }
            $png = Get-Item (Join-Path $report.FullName 'screenshot.png')
            if ($png.Length -gt 500KB) { $errors += "bug report screenshot is $([int]($png.Length / 1KB)) KB (limit 500)" }
          }

          # 5) Idle editor sleeps (queue 0-13): almost no frames while idle, wakes at once on an event
          $env:BDG_IDLE_TEST = '3'
          $log = Invoke-Editor 'Release' @{} 0
          Remove-Item Env:BDG_IDLE_TEST
          # frames drawn for input from someone at the desk do not count (local runs); CI has no mouse moving
          if ($log -match 'idle: .*frames=(\d+) .*wake_latency_ms=([\d.]+).* frames_without_input=(\d+)') {
            if ([int]$Matches[3] -gt 6) { $errors += "idle editor kept drawing ($($Matches[3]) frames without input in 3 s)" }
            if ([double]$Matches[2] -gt 50) { $errors += "idle wake-up too slow ($($Matches[2]) ms)" }
          } else { $errors += 'idle test line missing' }

          # 6) Docking (queue 1-1): splitter drag + tab move, then the saved layout comes back after a restart
          $env:BDG_LAYOUT = "$PWD/ci-layout.jsonl"
          Remove-Item $env:BDG_LAYOUT -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_DOCK_TEST = '1' } 10
          if ($log -notmatch 'dock test: hierarchy_w ([\d.]+) -> ([\d.]+)  console_leaf_tabs=1') { $errors += 'dock test line missing or tab not moved' }
          elseif ([math]::Abs(([double]$Matches[2] - [double]$Matches[1]) - 100) -gt 1) { $errors += "splitter drag moved $([double]$Matches[2] - [double]$Matches[1]) instead of 100" }
          $final1 = if ($log -match 'dock final: (.*)') { $Matches[1].Trim() } else { '' }
          $log = Invoke-Editor 'Release' @{} 5
          $final2 = if ($log -match 'dock final: (.*)') { $Matches[1].Trim() } else { '' }
          if ($log -notmatch 'dock: layout loaded' -or $final1 -ne $final2 -or -not $final1) { $errors += "dock layout not restored ('$final1' vs '$final2')" }
          Remove-Item Env:BDG_LAYOUT

          # 7) Command bus (queue 1-3): Inspector edit -> Ctrl+Z -> Ctrl+Y, selection; the saved log replays to the same scene
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_CMD_TEST = '1'; BDG_CMD_LOG = "$PWD/ci-commands.jsonl"; BDG_SCENE_DUMP = "$PWD/ci-scene1.jsonl" } 18
          if ($log -notmatch 'cmd test: edit=\[3,4,5\] undo=\[0,1,0\] redo=\[3,4,5\] maxHealth=100 undo_depth=1 selected=g9 light_card=1') { $errors += 'command bus test failed' }
          if ($log -notmatch 'history: Player: Transform.position = \[3,4,5\] \| Player: Health.maxHealth = 250 \(undone\)') { $errors += 'history panel jump failed' }
          $env:BDG_SCENE_DUMP = "$PWD/ci-scene2.jsonl"
          Start-Process build/Release/BidulgiEditor.exe -ArgumentList '--frames', '3', '--replay', "$PWD/ci-commands.jsonl" -WorkingDirectory $PWD -Wait
          Remove-Item Env:BDG_SCENE_DUMP
          if ((Get-Content Bidulgi.log -Raw -Encoding utf8) -notmatch 'replay: \d+ commands') { $errors += 'replay did not run' }
          if ((Get-Content ci-scene1.jsonl -Raw) -ne (Get-Content ci-scene2.jsonl -Raw)) { $errors += 'replayed command log gives a different scene' }
          Remove-Item Env:BDG_LAYOUT

          # 8) Crash report (queue 1-4b): a deliberate crash writes a minidump; the next start offers to report it
          $env:BDG_CRASH_TEST = '1'
          $p = Start-Process build/Release/BidulgiEditor.exe -ArgumentList '--frames', '10' -WorkingDirectory $PWD -PassThru -Wait
          Remove-Item Env:BDG_CRASH_TEST
          $crash = Get-ChildItem BugReports -Directory -Filter 'crash-*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $crash -or -not (Test-Path "$($crash.FullName)/crash.dmp") -or -not (Test-Path BugReports/pending-crash.txt)) { $errors += "crash report not written (exit $($p.ExitCode))" }
          $log = Invoke-Editor 'Release' @{} 5
          if ($log -notmatch 'crash: the previous session crashed' -or $log -notmatch 'crash: report button shown') { $errors += 'crash not offered on the next start' }

          # 9) Fault injection (queue 1-4c): a crashing panel and a failed check; the editor survives and autosaves
          $log = Invoke-Editor 'Release' @{ BDG_FAULT_TEST = '1' } 10
          if ($log -notmatch 'fault test: guard_failures=1 check_failures=1 frames=10 survived=1' -or $log -notmatch 'autosave: ') { $errors += 'fault injection test failed' }

          # 10) Shortcuts (queue 1-5): first-run banner -> Unity keys; Unreal preset -> other keys for the same actions
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $env:BDG_SHORTCUTS = "$PWD/ci-shortcuts.jsonl"
          Remove-Item $env:BDG_SHORTCUTS -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SHORTCUT_TEST = '1' } 14
          if ($log -notmatch 'shortcut test: banner_shown=1 unity_play=1 unreal_play=0 objects=10 preset=unreal conflicts=0 saved=1') { $errors += 'shortcut test failed' }
          $log = Invoke-Editor 'Release' @{} 3
          if ($log -notmatch 'shortcuts: preset unreal loaded') { $errors += 'shortcut preset not kept' }
          Remove-Item Env:BDG_SHORTCUTS, Env:BDG_LAYOUT

          # 11) Accessibility (queue 1-6): a UI Automation client reads the focused button; Ctrl+F6 moves to the next panel
          #     (its first control: the Hierarchy's "+" button, UI review B1)
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_A11Y_TEST = '1' } 8
          if ($log -notmatch 'a11y test: focused_name=컴포넌트 추가 control=Button children=(\d+) next_panel=h\.create') { $errors += 'accessibility test failed' }
          elseif ([int]$Matches[1] -lt 10) { $errors += "accessibility tree too small ($($Matches[1]) elements)" }
          Remove-Item Env:BDG_LAYOUT

          # 12) Scene model (queue 2-1): drag Weapon onto "Main" in the Hierarchy; it keeps its world position
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_DRAG_TEST = '1' } 6
          if ($log -notmatch 'drag test: weapon_parent="" world_kept=1 undo_depth=1') { $errors += 'hierarchy drag (keep world) failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 13) Scene files (queue 2-2): Ctrl+S saves; opening that file and saving again gives the same bytes
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $env:BDG_SCENE_FILE = "$PWD/ci-test.scene"
          Remove-Item $env:BDG_SCENE_FILE -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SAVE_TEST = '1' } 5
          if ($log -notmatch 'scene: saved .* \(9 objects\)') { $errors += 'Ctrl+S did not save the scene' }
          Copy-Item ci-test.scene ci-test-first.scene
          $log = Invoke-Editor 'Release' @{ BDG_SAVE_TEST = '1' } 5
          if ($log -notmatch 'scene: opened') { $errors += 'saved scene did not open' }
          if ((Get-FileHash ci-test.scene).Hash -ne (Get-FileHash ci-test-first.scene).Hash) { $errors += 'save -> open -> save changed the file' }
          Remove-Item Env:BDG_SCENE_FILE, Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 14) Asset database (queue 2-3): .meta files, a move in the editor and one outside it keep GUIDs and references
          $assets = "$PWD/ci-assets"
          Remove-Item -Recurse -Force $assets -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $assets | Out-Null
          foreach ($n in 'Knight', 'Sword', 'Crystal', 'Plane') { Set-Content "$assets/$n.glb" "glb-$n" -NoNewline }
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = $assets; BDG_ASSET_TEST = '1' } 120
          if ($log -notmatch 'asset test: knight_guid_kept=1 player_mesh="Characters/Knight.glb" weapon_mesh="Weapons/Sword.glb" watcher=1 orphans=0 assets=4') { $errors += 'asset database test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 15) Inspector (queue 2-4): Range slider drag + undo, F2 rename, Button as a command + undo, ShowIf
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_INSPECTOR_TEST = '1' } 20
          if ($log -notmatch 'inspector test: slider=25 undo_steps=1 after_undo=5 name=Hero revive=100 revive_undo=10 range_hidden=1 range_shown=1') { $errors += 'inspector test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 16) Multi-object editing (queue 2-4b): common components, "—" for differing values, one undo step for all,
          #     copy -> paste as new component, preset save and apply; the Inspector scrolls with the wheel
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_MULTI_TEST = '1'; BDG_PRESETS = "$PWD/ci-presets" } 24
          if ($log -notmatch 'multi test: common=Transform,MeshRenderer mixed=1 same=1 shared="M_Shared","M_Shared" undo_steps=1 restored="M_Gold","M_Knight" pasted=321 preset=321') { $errors += 'multi-object editing test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue
          # UI review B1: Hierarchy "+" -> Cube, row right-click -> child Point Light (menu shows the keys), "+ Add
          # Component" -> type "rigid" -> Enter, empty-space right-click -> UI Text under a new Canvas, Ctrl+Shift+N, undo
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_CREATE_TEST = '1' } 40
          if ($log -notmatch 'create test: plus=1 child=1 hints=1 addcomp=1 ui=1 shortcut=1 undo=1') { $errors += 'create objects / Add Component test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue
          # UI review B12 (U12): engine terms stay English with the Korean name as the tooltip's first line (real hover,
          # design-system/project/editor.ko.json); no button mixes Korean with non-term English; Add Component finds "강체"
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_LANG_TEST = '1' } 30
          if ($log -notmatch 'lang test: names=1 tooltip=1 card=1 mixed=1 search=1') { $errors += 'language rule test (U12) failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 17) Project panel (queue 2-5): real asset folder, C++ .h/.cpp shown as one class item, renamed together
          $proj = "$PWD/ci-project/Assets"
          Remove-Item -Recurse -Force "$PWD/ci-project" -ErrorAction SilentlyContinue
          foreach ($f in 'Characters/Knight.glb', 'Scripts/Weapon.h', 'Scripts/Weapon.cpp', 'Scripts/PlayerMove.cs', 'Textures/grass.png') {
            New-Item -ItemType File -Force "$proj/$f" | Out-Null; Set-Content "$proj/$f" "data $f" -NoNewline }
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = $proj; BDG_PROJECT_TEST = '1' } 10
          if ($log -notmatch 'project test: rows=Weapon:C\+\+ class,Weapon.h:Header,Weapon.cpp:Source,PlayerMove.cs:C# script selected=Scripts/Weapon renamed=Sword.h,Sword.cpp guids_kept=1') { $errors += 'project panel test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 18) Rendering reference board (queue 3-0): gamma, ColorChecker round trip, axes, winding, depth, light, UV
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-ref'; BDG_RENDER_TEST = '1' } 5
          if ($log -notmatch 'render test: \d+x\d+ grey=118 .* result=pass') { $errors += 'render reference board failed' }

          # 19) Scene view in 3D (queue 3-2): sample scene drawn, click picking, outline, orbit/zoom/frame/pan/fly, icons
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_SCENEVIEW_TEST = '1' } 26
          if ($log -notmatch 'sceneview test: drawn=1 pick=g8 outline=1 orbit=1 zoom=1 frame=1 pan=1 fly=1 deselect=1 icon=g9') { $errors += 'scene view test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 20) Gizmos (queue 3-3): move axis + plane, one undo step per drag, Esc cancel, rotate ring, scale, snap, local axes
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_GIZMO_TEST = '1' } 32
          if ($log -notmatch 'gizmo test: move=1 undo=1 plane=1 cancel=1 rotate=1 scale=1 snap=1 local=1') { $errors += 'gizmo test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 21) Materials and cooked textures (queue 3-1b): .material + .matinst + BC7/BC5 DDS, cooked once then reused
          Remove-Item -Recurse -Force "$PWD/ci-mat" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-mat/Assets" | Out-Null
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = "$PWD/ci-mat/Assets"; BDG_MATERIAL_TEST = '1' } 8
          if ($log -notmatch 'material test: red=1 blue=1 texture=1 presets=default,normal cooked=2 reused=2 formats=BC7_SRGBx7,BC5x7 undo=3') { $errors += 'material test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 22) Standard Khronos test models (queue 3-1b): fetched by tools/testassets.py (licences in Tests/testassets.lock.json)
          python tools/testassets.py fetch
          if ($LASTEXITCODE -ne 0) { $errors += 'test assets could not be fetched' }
          else {
            $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-assets'; BDG_RENDER_TEST = '1' } 5
            if ($log -notmatch 'render test: .*AlphaBlendModeTest:mats=6,base=6,mr=1,normal=1,tangents=9,opaque=2,mask=3,blend=1 drawn=1 result=pass') { $errors += 'standard test models failed' }
          }

          # 23) Quality tiers (queue 3-5): unlit potato, vertex-lit low, shadows from medium, FXAA, bloom, the tier badge
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_QUALITY_TEST = '1' } 27
          if ($log -notmatch 'quality test: potato=flat,noshadow low=lit,noshadow medium=lit,shadow high=lit,shadow,msaa4 fxaa=1 bloom=1 badge=1') { $errors += 'quality tier test failed' }
          # Round 6 TAA: thin bars against the sky; edge error against a 4x4 supersampled picture: no AA, FXAA, TAA (after 24
          # still frames, must be under 0.6 x no AA); jitter and history, the sharpen pass, a camera cut resets, a small move keeps
          $log = Invoke-Editor 'Release' @{ BDG_TAA_TEST = '1' } 50
          if ($log -notmatch 'taa test: .* better=1 history=1 sharpen=1 cut=1 move=1') { $errors += 'TAA test failed' }
          # Round 6 volumetric fog: froxels lit by the sun through its shadow map (a roof shades half the air), a red point
          # light glowing in the fog, height falloff (thinner high up), off on medium
          $log = Invoke-Editor 'Release' @{ BDG_FOG_TEST = '1' } 20
          if ($log -notmatch 'fog test: ran=1 shafts=1 glow=1 height=1 tiers=1') { $errors += 'volumetric fog test failed' }
          # Round 6 realtime GI (Halo Tier 1): a closed room of thin walls in a traced probe volume; visibility keeps the
          # sunlit probes outside from lighting the inside, a lamp's bounce light arrives within a few sweeps, off on medium
          $log = Invoke-Editor 'Release' @{ BDG_GI1_TEST = '1' } 66
          if ($log -notmatch 'gi1 test: ran=1 leak=1 react=1 tiers=1') { $errors += 'realtime GI (Tier 1) test failed' }
          # DDS textures (Bistro): BC1 / BC3 / BC5 / BC7 files uploaded as blocks where the driver has them, and with
          # BDG_NO_BLOCK_TEXTURES=1 decoded on the CPU first; each keeps its colour on the GPU
          $log = Invoke-Editor 'Release' @{ BDG_DDS_TEST = '1' } 5
          if ($log -notmatch 'dds test: .* all=1') { $errors += 'DDS texture test failed' }
          $log = Invoke-Editor 'Release' @{ BDG_DDS_TEST = '1'; BDG_NO_BLOCK_TEXTURES = '1' } 5
          if ($log -notmatch 'dds test: uploaded=0 decoded=4 .* all=1') { $errors += 'DDS texture test (decoded) failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 24) Render reference scene (queue 3-8): bookmarks, Albedo/Normal/Depth/Shadow views, wireframe, stored bookmark, GPU timers
          python tools/make_render_reference.py
          git diff --exit-code -- Tests/RenderReference
          if ($LASTEXITCODE -ne 0) { $errors += 'Tests/RenderReference is out of date: run tools/make_render_reference.py' }
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = "$PWD/Tests/RenderReference/Assets"; BDG_SCENE_FILE = "$PWD/Tests/RenderReference/Assets/Scenes/RenderReference.scene"; BDG_REFSCENE_TEST = '1'; BDG_RENDER_STATS = '1' } 24
          if ($log -notmatch 'refscene test: objects=290 jump=1 albedo=1 normal=1 depth=1 shadow=1 wire=1 store=1 undo=1 tier=potato timers=1') { $errors += 'render reference scene test failed' }
          if ($log -notmatch 'render passes: .*scene \d') { $errors += 'no GPU pass timings' }
          # Round 6 SSR on the reference scene: a mirror floor and a red box at bookmark 1; the box's mirror image with SSR,
          # the probe / sky where rays leave the picture, nothing on a rough floor
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = "$PWD/Tests/RenderReference/Assets"; BDG_SCENE_FILE = "$PWD/Tests/RenderReference/Assets/Scenes/RenderReference.scene"; BDG_SSR_TEST = '1' } 24
          if ($log -notmatch 'ssr test: ran=1 mirror=1 fallback=1 rough=1') { $errors += 'SSR test failed' }
          # View modes (UE-like): each of 20 modes renders the reference scene's bookmark 1 and differs from Lit the way it
          # should; Alt + 3 / 8 / 4, the grouped view menu (a click), the heat map legend
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = "$PWD/Tests/RenderReference/Assets"; BDG_SCENE_FILE = "$PWD/Tests/RenderReference/Assets/Scenes/RenderReference.scene"; BDG_VIEWMODE_TEST = '1' } 80
          if ($log -notmatch 'viewmode test: .* all=1') { $errors += 'view mode test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 25) Stress (queue 3-9): 10,000 instanced cubes + 16 4K BC7 textures; the same picture without instancing
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-stress'; BDG_STRESS_TEST = '1' } 22
          if ($log -notmatch 'stress test: draws_instanced=\d{1,2} draws_single=100\d\d same_picture=1') { $errors += 'stress / instancing test failed' }
          if ($log -notmatch 'stress: objects=\d+ .*textures=16x4096 vram_mb=') { $errors += 'stress numbers missing' }
          # culling (queue 3-10): close-up camera, most cubes culled, the same picture as drawing everything
          if ($log -notmatch 'culling test: drawn=\d{1,4} drawn_without=10017 culled=[1-9]\d{3,} shadow_culled=\d+ same_picture=1') { $errors += 'culling test failed' }

          # 26) Image compare per bookmark (queue 3-9): baselines made, the same build matches them, a change is caught
          Remove-Item -Recurse -Force "$PWD/ci-compare" -ErrorAction SilentlyContinue
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $cmp = @{ BDG_ASSETS = "$PWD/Tests/RenderReference/Assets"; BDG_SCENE_FILE = "$PWD/Tests/RenderReference/Assets/Scenes/RenderReference.scene"; BDG_RENDER_COMPARE = "$PWD/ci-compare/base"; BDG_COMPARE_OUT = "$PWD/ci-compare/out" }
          $log = Invoke-Editor 'Release' $cmp 42
          if ($log -notmatch 'compare summary: compared=0 created=9 failed=0') { $errors += 'compare: baselines not created' }
          $log = Invoke-Editor 'Release' $cmp 42
          if ($log -notmatch 'compare summary: compared=9 created=0 failed=0 worst=0\.00') { $errors += 'compare: the same build differs from its baselines' }
          $cmp['BDG_QUALITY_SET'] = 'exposure=1.8'
          $log = Invoke-Editor 'Release' $cmp 42
          if ($log -notmatch 'compare summary: compared=9 created=0 failed=[1-9]') { $errors += 'compare: a brighter picture was not caught' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 27) GI Tier 0 (reflection probes, IBL): Cornell box probe faces, mirror reflections of the walls, colour bleeding
          Remove-Item .cache/gi -Recurse -Force -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-gi'; BDG_RENDER_TEST = '1' } 5
          if ($log -notmatch 'gi test: .*faces=ok mirror=ok .* bleed=ok volume=ok .* lightmaps=ok .* probes_baked=1 volume_probes=48 result=pass') { $errors += 'GI Tier 0 probe test failed' }
          if ($log -notmatch 'gi: saved .*render-gi-[0-9a-f]{16}\.bdggi') { $errors += 'GI bake was not saved to .cache/gi' }
          if ($log -match '(gi: lightmaps: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 27b) the indirect-light debug view of the same box (GI Tier 0-B) renders and still finds the volume
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-gi'; BDG_RENDER_TEST = '1'; BDG_RENDER_VIEW = '7' } 5
          if ($log -notmatch 'gi test: .* volume=ok ') { $errors += 'GI indirect view failed' }
          # 27c) GI Tier 0-D: read-only like a runtime build -> the saved bake is loaded, same checks pass; text diagnosis
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-gi'; BDG_RENDER_TEST = '1'; BDG_GI_READONLY = '1'; BDG_GI_DIAGNOSE = '1' } 5
          if ($log -notmatch 'gi: loaded .*render-gi-') { $errors += 'GI cache was not loaded' }
          if ($log -match 'gi: lightmaps: ') { $errors += 'GI read-only run baked lightmaps' }
          if ($log -notmatch 'gi test: .*faces=ok mirror=ok .* bleed=ok volume=ok .* lightmaps=ok .* probes_baked=1 volume_probes=48 result=pass') { $errors += 'GI checks failed after loading the cache' }
          if ($log -notmatch 'gi diagnose: volume 4x3x4 = 48 probes .* inside objects [1-9]') { $errors += 'GI diagnose: volume line missing' }
          if ($log -notmatch 'gi diagnose: leaks \d+ suspected') { $errors += 'GI diagnose: leak line missing' }
          if ($log -notmatch 'gi diagnose: bake .* cache loaded ') { $errors += 'GI diagnose: cache line missing' }
          if ($log -match '(gi diagnose: volume[^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 27d) read-only without a saved bake: nothing is baked
          Remove-Item .cache/gi -Recurse -Force -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-gi'; BDG_RENDER_TEST = '1'; BDG_GI_READONLY = '1' } 5
          if ($log -notmatch 'gi: no baked GI at .*read-only') { $errors += 'GI read-only without cache: warning missing' }
          if ($log -notmatch 'gi test: .* probes_baked=0 volume_probes=0 ') { $errors += 'GI read-only without cache baked something' }

          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_GI_TEST = '1' } 12
          if ($log -notmatch 'gi editor test: added=1 baked=1 rebaked=1 after_undo=0 volume=32 volume_after_undo=0 lightmapped=[1-9]\d* lightmapped_after_undo=0') { $errors += 'GI probe editor test failed' }
          if ($log -notmatch 'gi: lightmaps: [1-9]\d* objects, atlas \d+x\d+') { $errors += 'GI lightmap bake from the chip missing' }
          if ($log -notmatch 'gi: saved .*scene-[0-9a-f]{16}\.bdggi') { $errors += 'GI editor bake was not saved' }
          if ($log -notmatch 'gi: baked 1 probe\(s\), one more bounce') { $errors += 'GI re-bake from the chip missing' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 3-3b snapping: grid (chip), vertex (V), surface (Ctrl+Shift), align / distribute chips, ruler (M)
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_SNAP_TEST = '1' } 26
          if ($log -notmatch 'snap test: grid=1 vertex=1 surface=1 align=1 distribute=1 measure=1') { $errors += 'snap / align / measure test failed' }
          if ($log -notmatch 'measure: 3\.0\d\d m') { $errors += 'ruler result not logged' }
          # Scene view toolbar (Unreal-like): Move / Rotate / Scale icons, grid value -> gizmo step, Ctrl frees a drag,
          # rotation snap 30, wheel while flying and the speed popup, values kept in the file, tooltips, one row at zoom 1 / 1.5 / 2
          $log = Invoke-Editor 'Release' @{ BDG_TOOLBAR_TEST = '1'; BDG_TOOLBAR = "$env:RUNNER_TEMP/bdg-toolbar.json" } 46
          if ($log -notmatch 'toolbar test: modes=1 grid=1 ctrl=1 rotate=1 wheel=1 popup=1 persist=1 tips=1 rows=1,1,1') { $errors += 'scene view toolbar test failed' }
          # UI designer (7-3): the UI Designer tab shows the canvas on a device screen; real drags move, resize, snap (guide);
          # the anchor picker keeps the on-screen rect, Ctrl+Z undoes it in one step, phone portrait keeps anchored layout
          # ... and the palette (a dragged Slider, a clicked Toggle; one undo step) and Preview (a click flips the toggle, put back after)
          $log = Invoke-Editor 'Release' @{ BDG_UIDESIGNER_TEST = '1' } 43
          if ($log -notmatch 'uidesigner test: tab=1 select=1 move=1 resize=1 snap=1 anchor=1 undo=1 resolution=1 palette=1 preview=1') { $errors += 'UI designer test failed' }
          # C# UI controls: UI.Toggle / Slider / Input / Dropdown / ScrollView read, set, OnChanged once per change, missing = stand-in
          $log = Invoke-Editor 'Release' @{ BDG_UICSHARP_TEST = '1'; BDG_SCRIPT_ASSEMBLIES = "$PWD/build/Release/Managed/Bidulgi.Samples.dll" } 24
          if ($log -notmatch 'uicsharp test: ui probe: read=1 set=1 changed=1 missing=1') { $errors += 'C# UI controls test failed' }
          # UI review B2: the menu bar with real clicks - eight menus open, Save shows its shortcut, GameObject > 3D > Cube
          # (one undo step) and Edit > Undo, Window > Open panel > Console, Component > Add (searched) > AudioSource
          $log = Invoke-Editor 'Release' @{ BDG_MENUBAR_TEST = '1' } 57
          if ($log -notmatch 'menubar test: open=1 keys=1 create=1 undo=1 panel=1 component=1') { $errors += 'menu bar test failed' }
          # UI review B4: no project -> the Project panel's empty state; Graph / Animation / Scripting say "not ready" in the
          # Scene panel and its button goes back to Level (real clicks); New project (a real click, the folder picker answered
          # by BDG_DIALOG_ANSWER) makes Assets / Scenes in an empty folder and opens it
          $newproj = "$env:RUNNER_TEMP/bdg-newproj"; Remove-Item -Recurse -Force $newproj -ErrorAction SilentlyContinue; New-Item -ItemType Directory $newproj | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_EMPTYWS_TEST = '1'; BDG_DIALOG_ANSWER = $newproj } 22
          if ($log -notmatch 'emptyws test: empty=1 tabs=1 back=1 project=1') { $errors += 'empty workspace test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 3-3c greybox: Blockout tool, add chips, face push / pull on the grid, Esc, undo, all shapes, picking
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_BLOCKOUT_TEST = '1' } 24
          if ($log -notmatch 'blockout test: create=1 push=1 top=1 cancel=1 undo=1 shapes=3 pick=1') { $errors += 'greybox test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # Round 6 terrain: a heightmap terrain (hills, 4 layers) in the Scene view: chunks at several LODs, culled ones,
          # no sky through cracks looking straight down; the Terrain tool (T) raises ground (one undo step, undo / redo),
          # paints a layer (colour map rebaked there, the grass on the other layer goes); per tier triangles / grass / ms;
          # in play a C# TerrainProbe capsule stands on the Jolt height field where Terrain.HeightAt says
          $tr = Join-Path $env:RUNNER_TEMP 'bdg-terrain'
          Remove-Item -Recurse -Force $tr -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$tr/Assets", "$tr/FoliageAssets" | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_TERRAIN_TEST = '1'; BDG_ASSETS = "$tr/Assets"; BDG_SCRIPT_ASSEMBLIES = "$PWD/build/Release/Managed/Bidulgi.Samples.dll" } 200
          if ($log -notmatch 'terrain test: render=1 lods=1 cracks=1 sculpt=1 undo=1 paint=1 foliage=1 tiers=1 stand=1') { $errors += 'terrain test failed' }
          if ($log -match '(terrain test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # Round 6 foliage: grass and trees (LOD 0, LOD 1, far cards) scattered on a terrain; wind sways them (two wind times
          # differ, wind 0 does not), fade with distance, culled facing away, the low tier's grass budget
          $log = Invoke-Editor 'Release' @{ BDG_FOLIAGE_TEST = '1'; BDG_ASSETS = "$tr/FoliageAssets" } 40
          if ($log -notmatch 'foliage test: plants=1 lods=1 wind=1 calm=1 fade=1 culled=1 budget=1') { $errors += 'foliage test failed' }
          if ($log -match '(foliage test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }

          # 3-6 play mode: a copy of the world runs (Rotator), edits inside play undo among themselves, Stop restores
          # the edited world and its history, the kept values are one undo step, the Game view renders the camera
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_PLAY_TEST = '1' } 18
          if ($log -notmatch 'play test: start=1 runs=1 history=1 restored=1 pending=2 keep=1 undo=1 game=1 pause=1 step=1 scale=1 frame=1 marked=1') { $errors += 'play mode test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 3-7 platform budget: Budget chip, platform badge, bars from the last render, over budget, pick the heaviest
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_BUDGET_TEST = '1' } 11
          if ($log -notmatch 'budget test: panel=1 platform=Android bars=4 values=1 over=1 chip=1 culprit=1') { $errors += 'platform budget test failed' }
          if ($log -match '(budget: Android[^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 2-5b references: a small project (a model and a material the open scene uses, a texture the material uses,
          # unused files), find references, unused, delete warning, delete, replace in the open scene, batch rename
          Remove-Item -Recurse -Force "$PWD/ci-refs" -ErrorAction SilentlyContinue
          $refs = "$PWD/ci-refs/Assets"
          foreach ($d in 'Characters','Materials','Textures','Models') { New-Item -ItemType Directory -Force "$refs/$d" | Out-Null }
          Set-Content -Path "$refs/Characters/Knight.glb" -Value 'knight' -NoNewline
          Set-Content -Path "$refs/Characters/Other.glb" -Value 'other' -NoNewline
          Set-Content -Path "$refs/Models/Unused.glb" -Value 'unused' -NoNewline
          Set-Content -Path "$refs/Textures/knight.png" -Value 'png1' -NoNewline
          Set-Content -Path "$refs/Textures/old.png" -Value 'png2' -NoNewline
          [IO.File]::WriteAllText("$refs/Materials/M_Knight.material", "{`"material`":`"M_Knight`"}`n{`"param`":`"BaseColorMap`",`"type`":`"texture`",`"value`":`"Textures/knight.png`"}`n")
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_REFS_TEST = '1'; BDG_ASSETS = $refs } 28
          if ($log -notmatch 'refs test: refs=1 jump=1 unused=1 warn=1 delete=1 replace=1 undo=1 rename=1') { $errors += 'references / unused / replace test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 2-5c theme editor: a project Theme.json applied at start, picker, live swatch, slider, revert, hand edit, reset
          Remove-Item -Recurse -Force "$PWD/ci-theme" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-theme" | Out-Null
          [IO.File]::WriteAllText("$PWD/ci-theme/Theme.json", "{`"colors`":{`"panel`":`"#203040`"}}`n")
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_THEME_TEST = '1'; BDG_THEME_FILE = "$PWD/ci-theme/Theme.json" } 45
          if ($log -notmatch 'theme test: start=1 open=1 live=1 slider=1 revert=1 file=1 reset=1') { $errors += 'theme editor test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 2-5d drag-and-drop import: an 8x8 PNG and a glTF with an external .bin outside an empty project whose rules
          # want T_ textures up to 4 px; drop on the Project panel, again (renamed), on the Scene view, change the .bin
          Remove-Item -Recurse -Force "$PWD/ci-import" -ErrorAction SilentlyContinue
          $imp = "$PWD/ci-import"
          foreach ($d in 'src','Project/Assets','Project/ProjectSettings') { New-Item -ItemType Directory -Force "$imp/$d" | Out-Null }
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 8, 8
          $bmp.Save("$imp/src/rock.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          $tri = New-Object byte[] 36
          [BitConverter]::GetBytes([single]1).CopyTo($tri, 12)
          [BitConverter]::GetBytes([single]1).CopyTo($tri, 28)
          [IO.File]::WriteAllBytes("$imp/src/Box.bin", $tri)
          [IO.File]::WriteAllText("$imp/src/Box.gltf", '{"asset":{"version":"2.0"},"scene":0,"scenes":[{"nodes":[0]}],"nodes":[{"mesh":0}],"meshes":[{"primitives":[{"attributes":{"POSITION":0}}]}],"buffers":[{"uri":"Box.bin","byteLength":36}],"bufferViews":[{"buffer":0,"byteLength":36}],"accessors":[{"bufferView":0,"componentType":5126,"count":3,"type":"VEC3","min":[0,0,0],"max":[1,1,0]}]}')
          [IO.File]::WriteAllText("$imp/Project/ProjectSettings/AssetRules.json", '{"prefix":{"texture":"T_"},"maxTextureSize":4}')
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_IMPORT_TEST = '1'; BDG_IMPORT_SRC = "$imp/src"; BDG_ASSETS = "$imp/Project/Assets"; BDG_SCENE_FILE = "$imp/Main.scene" } 60
          if ($log -notmatch 'import test: import=1 rename=1 rules=1 view=1 place=1 reimport=1 save=1') { $errors += 'drag-and-drop import test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 2-6 new scene: Ctrl+N gives the basic 3D scene; camera, grid, fog, exposure, Ctrl+S writes it
          Remove-Item -Recurse -Force "$PWD/ci-newscene" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-newscene" | Out-Null
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_NEWSCENE_TEST = '1'; BDG_SCENE_FILE = "$PWD/ci-newscene/Main.scene" } 20
          if ($log -notmatch 'new scene test: scene=1 camera=1 grid=1 fog=1 exposure=1 saved=1') { $errors += 'new scene test failed' }
          if (-not (Test-Path "$PWD/ci-newscene/New Scene.scene")) { $errors += 'new scene file missing' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-1 previews: a red texture, a glTF triangle, a red material; tiles, thumbnails, Inspector preview turning
          Remove-Item -Recurse -Force "$PWD/ci-preview" -ErrorAction SilentlyContinue
          $pv = "$PWD/ci-preview/Assets"
          New-Item -ItemType Directory -Force $pv | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 16, 16
          $gfx = [System.Drawing.Graphics]::FromImage($bmp); $gfx.Clear([System.Drawing.Color]::Red); $gfx.Dispose()
          $bmp.Save("$pv/T_Red.png", [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          $tri = New-Object byte[] 36
          [BitConverter]::GetBytes([single]1).CopyTo($tri, 12)
          [BitConverter]::GetBytes([single]1).CopyTo($tri, 28)
          [IO.File]::WriteAllBytes("$pv/Tri.bin", $tri)
          [IO.File]::WriteAllText("$pv/Tri.gltf", '{"asset":{"version":"2.0"},"scene":0,"scenes":[{"nodes":[0]}],"nodes":[{"mesh":0}],"meshes":[{"primitives":[{"attributes":{"POSITION":0}}]}],"buffers":[{"uri":"Tri.bin","byteLength":36}],"bufferViews":[{"buffer":0,"byteLength":36}],"accessors":[{"bufferView":0,"componentType":5126,"count":3,"type":"VEC3","min":[0,0,0],"max":[1,1,0]}],"materials":[{"doubleSided":true}]}')
          [IO.File]::WriteAllText("$pv/M_Red.material", "{`"material`":`"M_Red`"}`n{`"param`":`"BaseColor`",`"type`":`"color`",`"value`":`"#e02020`"}`n")
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_PREVIEW_TEST = '1'; BDG_ASSETS = $pv } 80
          if ($log -notmatch 'preview test: tiles=1 thumbs=1 material=1 model=1 inspect=1 orbit=1 back=1 list=1') { $errors += 'asset preview test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-2 hierarchy tree: guide lines, fold arrow, reveal on pick, Alt+click branch, saved folds
          Remove-Item -Recurse -Force "$PWD/ci-tree" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-tree" | Out-Null
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_TREE_TEST = '1'; BDG_FOLDS = "$PWD/ci-tree/folds.jsonl" } 14
          if ($log -notmatch 'tree test: guides=1 fold=1 lines=1 reveal=1 altfold=1 altopen=1 saved=1') { $errors += 'hierarchy tree test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-3 scene icons: component icons drawn, camera frustum, light range, Icons chip, icon click picks
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_SCENEICON_TEST = '1' } 14
          if ($log -notmatch 'scene icon test: icons=1 drawn=1 frustum=1 range=1 chip=1 pick=1') { $errors += 'scene icon test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # Quit: unsaved changes ask with a save checklist, Cancel stays, autosave backup + recovery offer, Don't Save quits
          $log = Invoke-Editor 'Release' @{ BDG_QUIT_TEST = '1' } 20
          if ($log -notmatch 'quit test: dirty=1 ask=1 cancel=1 autosave=1 quit=1 cleaned=1') { $errors += 'quit / autosave test failed' }
          # Project settings: defaults, panel fields, edits, problems list, Save All writes only changed values
          Remove-Item "$PWD/ci-project-settings.json" -ErrorAction SilentlyContinue
          $log = Invoke-Editor 'Release' @{ BDG_SETTINGS_TEST = '1'; BDG_PROJECT_SETTINGS = "$PWD/ci-project-settings.json" } 9
          if ($log -notmatch 'project test: defaults=1 name=1 problems=1 physics=1 saved=1') { $errors += 'project settings test failed' }

          # UI choices: bool switch, enum combo / segmented pick, undo, tooltip on hover
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_CHOICE_TEST = '1' } 14
          if ($log -notmatch 'choice test: toggle=1 pick=1 undo=1 tooltip=1') { $errors += 'Inspector choice test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-4a inspector and UI: field arithmetic, right-click menu (default / copy / paste), UI zoom saved
          Remove-Item -Recurse -Force "$PWD/ci-uiedit" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-uiedit" | Out-Null
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_UIEDIT_TEST = '1'; BDG_PREFS = "$PWD/ci-uiedit/prefs.json" } 23
          if ($log -notmatch 'ui edit test: expr=1 vector=1 menu=1 copy=1 paste\+default=1 close=1 zoom=1') { $errors += 'inspector / UI edit test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-4b inspector: label drag, vector axis drag and typing, colour picker, asset drop, Hierarchy arrows
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_INSPECT2_TEST = '1' } 35
          if ($log -notmatch 'inspect2 test: scrub=1 axis=1 select=1 color=1 drop=1 keys=1') { $errors += 'inspector fields test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-5 FBX / OBJ import (ufbx): an OBJ with .mtl and texture, an ASCII FBX in centimetres
          Remove-Item -Recurse -Force "$PWD/ci-fbx" -ErrorAction SilentlyContinue
          $fbx = "$PWD/ci-fbx/Assets"
          New-Item -ItemType Directory -Force "$fbx/tex" | Out-Null
          [IO.File]::WriteAllText("$fbx/Quad.obj", "mtllib Quad.mtl`nv 0 0 0`nv 2 0 0`nv 2 2 0`nv 0 2 0`nvt 0 0`nvt 1 0`nvt 1 1`nvt 0 1`nvn 0 0 1`nusemtl Red`nf 1/1/1 2/2/1 3/3/1 4/4/1`n")
          [IO.File]::WriteAllText("$fbx/Quad.mtl", "newmtl Red`nKd 1 0.2 0.2`nmap_Kd tex/red.png`n")
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 8, 8
          $gfx = [System.Drawing.Graphics]::FromImage($bmp); $gfx.Clear([System.Drawing.Color]::OrangeRed); $gfx.Dispose()
          $bmp.Save("$fbx/tex/red.png", [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          $fbxText = @(
            '; FBX 7.4.0 project file', 'FBXHeaderExtension:  {', ' FBXHeaderVersion: 1003', ' FBXVersion: 7400', '}',
            'GlobalSettings:  {', ' Version: 1000', ' Properties70:  {',
            '  P: "UpAxis", "int", "Integer", "",1', '  P: "UpAxisSign", "int", "Integer", "",1',
            '  P: "FrontAxis", "int", "Integer", "",2', '  P: "FrontAxisSign", "int", "Integer", "",1',
            '  P: "CoordAxis", "int", "Integer", "",0', '  P: "CoordAxisSign", "int", "Integer", "",1',
            '  P: "UnitScaleFactor", "double", "Number", "",1', ' }', '}',
            'Objects:  {', ' Geometry: 1000, "Geometry::Tri", "Mesh" {', '  Vertices: *9 {', '   a: 0,0,0,100,0,0,0,100,0', '  }',
            '  PolygonVertexIndex: *3 {', '   a: 0,1,-3', '  }', ' }', ' Model: 2000, "Model::Tri", "Mesh" {', '  Version: 232', ' }',
            ' Material: 3000, "Material::Red", "" {', '  ShadingModel: "phong"', '  Properties70:  {',
            '   P: "DiffuseColor", "Color", "", "A",0.2,0.6,1', '  }', ' }', '}',
            'Connections:  {', ' C: "OO",2000,0', ' C: "OO",1000,2000', ' C: "OO",3000,2000', '}') -join "`n"
          [IO.File]::WriteAllText("$fbx/Tri.fbx", $fbxText + "`n")
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_FBX_TEST = '1'; BDG_ASSETS = $fbx } 40
          if ($log -notmatch 'fbx test: thumbs=1 pictures=1 placed=1 inspect=1') { $errors += 'FBX / OBJ import test failed' }
          if ($log -match 'did not import') { $errors += 'a model did not import' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-6a post process volume: vignette, grain, chromatic aberration, exposure, auto exposure, bounded, removed
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_POSTFX_TEST = '1'; BDG_QUALITY = 'high' } 28
          if ($log -notmatch 'postfx test: vignette=1 grain=1 aberration=1 exposure=1 auto=1 bounded=1 restore=1') { $errors += 'post process volume test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-6b depth of field and lens flare
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_POSTFX2_TEST = '1'; BDG_QUALITY = 'high' } 20
          if ($log -notmatch 'postfx2 test: blur=1 focus=1 flare=1 restore=1') { $errors += 'depth of field / lens flare test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # E-7 light shafts (god rays): toward the sun, blocked by a wall, none facing away
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_SHAFTS_TEST = '1'; BDG_QUALITY = 'high' } 20
          if ($log -notmatch 'shafts test: sun=1 rays=1 occluded=1 away=1') { $errors += 'light shafts test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # AI-2 the AI reference (Docs/llms.txt, Docs/api/*) matches the components, bdg commands and C# API in this commit
          $llms = (python -X utf8 tools/gen_llms.py --check --bdg "$PWD/build/Release/bdg.exe" 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0) { $errors += "AI reference out of date (python tools/gen_llms.py): $llms" }
          # 2-7 `bdg` command line in a Korean-named folder: new, view, set (dry run and real), add, validate (exit codes)
          $cli = Join-Path $PWD 'ci-cli'
          Remove-Item -Recurse -Force $cli -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cli | Out-Null
          $bdg = Join-Path $PWD 'build/Release/bdg.exe'
          [Console]::OutputEncoding = [Text.Encoding]::UTF8 # bdg prints UTF-8 (Korean messages)
          Push-Location $cli
          & $bdg new '게임' | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $cli '게임/Scenes/Main.scene'))) { $errors += 'bdg new failed' }
          Set-Location (Join-Path $cli '게임')
          $view = (& $bdg view) -join "`n"
          if ($view -notmatch 'sun\s+Light\s+#Sun\s+rot -45,-30,0 \| Light type=Directional intensity=3') { $errors += 'bdg view output unexpected' }
          & $bdg set sun 'Light.intensity=5' | Out-Null
          & $bdg add crate --pos 1,0.5,2 --comp MeshRenderer | Out-Null
          & $bdg set crate MeshRenderer.mesh=Rock.glb | Out-Null
          & $bdg validate | Out-Null
          if ($LASTEXITCODE -ne 1) { $errors += 'bdg validate did not report the missing mesh' }
          & $bdg set crate MeshRenderer.mesh=Cube | Out-Null
          $val = (& $bdg validate) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $val -notmatch '통과') { $errors += 'bdg validate failed on a valid scene' }
          if (Test-Path 'Bidulgi.log') { $errors += 'bdg wrote Bidulgi.log into the project' }
          # AI-1 `bdg shot`: the editor renders the scene, the picture path is printed; a camera; a missing scene fails
          $shot = (& $bdg shot --camera '30,-20,8' --frames 12 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $shot -notmatch 'Main\.png' -or -not (Test-Path (Join-Path $cli '게임/.cache/shots/Main.png'))) {
            $errors += "bdg shot failed (exit $LASTEXITCODE): $shot"
            if (Test-Path 'Bidulgi.log') { Write-Host '----- bdg shot: editor log'; Get-Content 'Bidulgi.log' -Encoding utf8 | Select-Object -Last 40 | Write-Host }
          }
          Remove-Item -Recurse -Force '.cache', 'Bidulgi.log' -ErrorAction SilentlyContinue
          & $bdg shot Nope 2>$null | Out-Null
          if ($LASTEXITCODE -ne 1) { $errors += 'bdg shot did not fail on a missing scene' }
          # AI-4 `bdg mcp`: an MCP client's first messages on stdin (initialize, tools/list, scene_view, set with dry_run,
          # shot) get one JSON-RPC reply line each; the dry run saves nothing; the picture comes back as a PNG image block
          $mcpIn = Join-Path $env:RUNNER_TEMP 'mcp-in.txt'
          $mcpOut = Join-Path $env:RUNNER_TEMP 'mcp-out.txt'
          @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"scene_view","arguments":{}}}'
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"set","arguments":{"target":"sun","values":{"Light.intensity":9},"dry_run":true}}}'
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"shot","arguments":{"camera":"30,-20,8"}}}'
          ) -join "`n" | Set-Content -NoNewline -Encoding ascii $mcpIn
          $p = Start-Process $bdg -ArgumentList 'mcp', '--project', '.' -NoNewWindow -PassThru -Wait -RedirectStandardInput $mcpIn -RedirectStandardOutput $mcpOut
          $replies = @{}
          foreach ($line in (Get-Content $mcpOut -Encoding utf8)) { $r = $line | ConvertFrom-Json; $replies[[int]$r.id] = $r }
          $png = $replies[5].result.content | Where-Object { $_.type -eq 'image' } | Select-Object -First 1
          $pngOk = $png -and $png.mimeType -eq 'image/png' -and [Convert]::FromBase64String($png.data)[1] -eq 0x50
          if ($p.ExitCode -ne 0 -or $replies.Count -ne 5 -or $replies[1].result.protocolVersion -ne '2025-06-18' -or $replies[2].result.tools.Count -lt 15 -or
              $replies[3].result.isError -or ($replies[3].result.structuredContent.output -join "`n") -notmatch 'sun\s+Light' -or
              $replies[4].result.isError -or ($replies[4].result.structuredContent.output -join "`n") -notmatch '"intensity":9' -or -not $pngOk) {
            $errors += "bdg mcp failed (exit $($p.ExitCode)): $((Get-Content $mcpOut -Encoding utf8 -Raw) -replace '"data":"[^"]{200,}"', '"data":"..."')"
          }
          if (((& $bdg view) -join "`n") -notmatch 'intensity=5') { $errors += 'bdg mcp: set with dry_run changed the scene' }
          Remove-Item -Recurse -Force '.cache', 'Bidulgi.log', $mcpIn, $mcpOut -ErrorAction SilentlyContinue
          Pop-Location
          # AI-4 live link: the editor listens (.cache/editor.json); a client renames an object through it (the open
          # scene, one undo step), a dry run changes nothing, a view sees the new name; the file goes when the editor ends
          $log = Invoke-Editor 'Release' @{ BDG_MCP_LIVE_TEST = '1' } 90
          if ($log -notmatch 'mcp live test: file=1 set=1 dry=1 view=1 undo=1') { $errors += 'bdg mcp live editor link failed' }
          if (Test-Path '.cache/editor.json') { $errors += 'the editor left .cache/editor.json behind' }

          # 4-1 C# scripting: the editor hosts .NET; C# calls Health.Damage, reads Ratio, writes fields (undoable, source script)
          $log = Invoke-Editor 'Release' @{ BDG_CSHARP_TEST = '1' } 8
          if ($log -notmatch 'csharp test: started=1 self=1 values=1 steps=3 script=1 undo=1') { $errors += 'C# scripting test failed' }
          # 4-5 debugging: BDG_CSHARP_DEBUG_WAIT holds scripting for a debugger, then goes on when none attaches
          $log = Invoke-Editor 'Release' @{ BDG_CSHARP_TEST = '1'; BDG_CSHARP_DEBUG_WAIT = '0.3' } 8
          if ($log -notmatch 'C#: no debugger attached; going on' -or $log -notmatch 'csharp test: started=1 self=1') { $errors += 'C# debugger wait failed' }

          # 4-2 C# Behaviours: Spinner turns its object in play mode, lifecycle order, Stop restores the edited world
          $env:BDG_SCRIPT_ASSEMBLIES = "$PWD/build/Release/Managed/Bidulgi.Samples.dll"
          $log = Invoke-Editor 'Release' @{ BDG_BEHAVIOUR_TEST = '1' } 20
          if ($log -notmatch 'behaviour test: types=16 instances=2 spun=1 order=1 restored=1 ended=1') { $errors += 'C# behaviour lifecycle test failed' }
          # 4-3 [Edit] fields: C# defaults, Inspector slider / choice, saved value before Awake, edit while playing, live value back
          $log = Invoke-Editor 'Release' @{ BDG_EDITFIELD_TEST = '1' } 17
          if ($log -notmatch 'edit field test: defaults=1 inspector=1 saved=1 push=1 pull=1 restored=1') { $errors += 'C# [Edit] field test failed' }
          # 4-4c easy API: [Auto], Get / Find / FindNearest, Spawn / Destroy, After / Every, await Wait / NextFrame, Tween, Random
          $log = Invoke-Editor 'Release' @{ BDG_EASYAPI_TEST = '1' } 75
          if ($log -notmatch 'easy probe: get=1 find=1 spawn=1 nearest=1 destroy=1 after=1 every=1 wait=1 tween=1 random=1') { $errors += 'C# easy API test failed' }
          if ($log -notmatch 'easy api test: restored=1 instances=0') { $errors += 'C# easy API test: play mode did not clean up' }
          # 6-5b game API: C# GameApiProbe saves (Vector3, list, Korean text) to the save folder, the second Play reads
          # it back; event bus (name, value, type, Off, a destroyed listener), Raycast / OverlapSphere on static boxes,
          # Vfx.Play (12 sparks spawn, then the one-shot is gone); the slot file is versioned JSON
          $ga = Join-Path $env:RUNNER_TEMP 'bdg-gameapi'
          Remove-Item -Recurse -Force $ga -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$ga/Assets", "$ga/Saves" | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_GAMEAPI_TEST = '1'; BDG_ASSETS = "$ga/Assets"; BDG_SAVE_DIR = "$ga/Saves" } 200
          if ($log -notmatch 'game api test: save=1 events=1 raycast=1 overlap=1 vfx=1 restored=1 file=1') { $errors += 'game API test (saves, events, raycast, vfx) failed' }
          # Round 7 multiplayer: the editor plays as a Listen Server through the Play options (2 players, 10 % loss) and starts
          # a client process, then a late second one: spawns, the owner's predicted moves on the server, [Replicated] +
          # OnRep, [Server] / [Client] / [Multicast] calls, the late joiner gets the world, the first client leaving cleans
          # up its player (the player processes log into the test project's .cache/net)
          $nt = Join-Path $env:RUNNER_TEMP 'bdg-net'
          Remove-Item -Recurse -Force $nt -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $nt | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_NET_TEST = '1'; BDG_NET_DIR = $nt; BDG_HIDDEN = '1' } 6000
          if ($log -notmatch 'net test: spawn=1 sync=1 onrep=1 rpc=1 late=1 left=1') {
            $errors += 'multiplayer test failed'
            Get-ChildItem "$nt/.cache/net/*.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "----- $($_.Name)"; Get-Content $_ -Raw -Encoding utf8 | Write-Host }
          }
          if ($log -match '(net test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 6-VFX P-1 particles: a ParticleSystem flame in front of the game camera: live count = rate x time, then rate x
          # lifetime, particles die, the Game view is brighter with them (pixels); a 3000 burst is cut to 500 at potato,
          # whole at ultra; Stop clears all
          New-Item -ItemType Directory -Force "$ga/VfxAssets" | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_VFX_TEST = '1'; BDG_ASSETS = "$ga/VfxAssets" } 150
          if ($log -notmatch 'vfx test: count=1 render=1 tiers=1 cleared=1') { $errors += 'particle (VFX) test failed' }
          if ($log -match '(vfx test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 4-6b async waits: game time (paused = no progress), cancelled on delete / disable / self-destroy, back on the game thread
          $log = Invoke-Editor 'Release' @{ BDG_AWAIT_TEST = '1' } 70
          if ($log -notmatch 'await test: pause=1 deleted=1 disabled=1 timed=1 self=1 errors=0') { $errors += 'C# await test failed' }
          # 4-4d data tables: a .table.jsonl with a header and a .csv read from C# with Data.Get / All / TryGet / Row
          $log = Invoke-Editor 'Release' @{ BDG_DATATABLE_TEST = '1' } 12
          if ($log -notmatch 'data probe: get=1 defaults=1 all=1 csv=1 missing=1 untyped=1') { $errors += 'C# data table test failed' }
          # 6-2 physics (Jolt 3D, Box2D 2D): a box falls and rests, a sphere rolls down a ramp, a trigger fires, a 2D box
          # rests, two paused step-by-step runs end bit-identical; C# PhysicsProbe gets OnCollisionEnter / OnTriggerEnter and AddImpulse
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_PHYSICS_TEST = '1' } 330
          if ($log -notmatch 'physics test: fall=1 roll=1 trigger=1 2d=1 deterministic=1 csharp=1 button=1') { $errors += 'physics test failed' }
          if ($log -match '(physics test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 6-4 input actions: Input/Actions.jsonl + contexts; injected D / Space / mouse reach a C# InputProbe through the
          # focused Game view (Update and FixedUpdate), Escape returns the input to the editor, a click takes it back, a
          # higher-priority context takes Space
          Remove-Item -Recurse -Force "$PWD/ci-input" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-input/Assets" | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_INPUT_TEST = '1'; BDG_ASSETS = "$PWD/ci-input/Assets" } 26
          if ($log -notmatch 'input test: focus=1 move=1 jump=1 fixed=1 look=1 escape=1 click=1 context=1') { $errors += 'input actions test failed' }
          # 6-1 prefabs: create from an object, place (command, Scene view drop), override (Inspector bar), prefab edit
          # reaches only the instance without the override, revert + undo, apply, save / reopen, build keeps the prefab,
          # Hierarchy -> Project folder, C# Spawn("Prefabs/Enemy.prefab")
          Remove-Item -Recurse -Force "$PWD/ci-prefab" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-prefab/Assets" | Out-Null
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_PREFAB_TEST = '1'; BDG_ASSETS = "$PWD/ci-prefab/Assets" } 20 # BDG_SCRIPT_ASSEMBLIES: set above
          if ($log -notmatch 'prefab test: create=1 place=1 inspector=1 propagate=1 revert=1 apply=1 reopen=1 build=1 drop=1 csharp=1') { $errors += 'prefab test failed' }
          # 7-1 skeletal animation: the generated test rig (glTF skin, 3 clips) and its .animgraph in a new project; the
          # Scene view skins it on the GPU (rest-pose bounds), in play C# AnimProbe's SetFloat("Speed") cross-fades
          # Idle -> Run over 0.25 s (Inspector shows state and Speed), root motion moves it, bounds follow the pose,
          # Footstep events reach C#, the Inspector preview plays the first clip; then the project is built and the
          # built player plays it (events reach C# there too)
          $anim = Join-Path $env:RUNNER_TEMP 'bdg-anim'
          Remove-Item -Recurse -Force $anim -ErrorAction SilentlyContinue
          & "$PWD/build/Release/bdg.exe" new $anim | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_ANIM_TEST = '1'; BDG_ASSETS = "$anim/Assets" } 120 # BDG_SCRIPT_ASSEMBLIES: set above
          if ($log -notmatch 'anim test: render=1 inspector=1 fade=1 bounds=1 rootmotion=1 events=1 csharp=1 preview=1') { $errors += 'animation test failed' }
          Push-Location $anim
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" build --scripts "$env:GITHUB_WORKSPACE/build/Release/Managed/Bidulgi.Samples.dll" | Out-String | Write-Host
          $animBuild = $LASTEXITCODE
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE/mesa/x64/*.dll" "$anim/Builds/Windows-Development/" -Force # software OpenGL next to the built game (no GPU on the runner)
          $env:BDG_PLAYER_CACHE = Join-Path $env:RUNNER_TEMP 'bdg-anim-cache'; $env:BDG_PLAYER_QUIET = '1'
          $p = Start-Process "$anim/Builds/Windows-Development/My Game.exe" -ArgumentList '--frames', 120 -PassThru -Wait
          Remove-Item Env:BDG_PLAYER_CACHE, Env:BDG_PLAYER_QUIET
          $alog = Get-Content "$anim/Builds/Windows-Development/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- built animation game (exit $($p.ExitCode))"; Write-Host $alog
          if ($animBuild -ne 0 -or $p.ExitCode -ne 0 -or $alog -notmatch 'anim probe: run=1 events=[2-9]' -or $alog -notmatch 'animation: stopped \(1 animators') { $errors += 'built animation game failed' }
          # 7-1 part 2 / 7-1b: the generated humanoid three times on physics ground: blend weights follow Speed (set from C#),
          # foot IK lifts the left foot onto a 20 cm step, the head turns to a target (aim offset), C# Ragdoll.Activate()
          # on "death": the skeleton falls
          $ik = Join-Path $env:RUNNER_TEMP 'bdg-ik'
          Remove-Item -Recurse -Force $ik -ErrorAction SilentlyContinue
          & "$PWD/build/Release/bdg.exe" new $ik | Out-Null
          $log = Invoke-Editor 'Release' @{ BDG_IK_TEST = '1'; BDG_ASSETS = "$ik/Assets" } 100 # BDG_SCRIPT_ASSEMBLIES: set above
          if ($log -notmatch 'ik test: render=1 blend=1 footik=1 lookat=1 ragdoll=1 csharp=1') { $errors += 'IK / blend space / ragdoll test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue
          # 6-3 audio (no device: mixed and measured): a 3D AudioSource plays, fades with distance, pauses; C# Audio API
          $log = Invoke-Editor 'Release' @{ BDG_AUDIO_TEST = '1' } 30
          if ($log -notmatch 'audio test: plays=1 distance=1 pause=1 csharp=1 stopped=1') { $errors += 'audio test failed' }
          Remove-Item Env:BDG_SCRIPT_ASSEMBLIES -ErrorAction SilentlyContinue

          # 4-4 hot reload: v2 of the samples written over the loaded copy while playing; values, state and new code kept
          $log = Invoke-Editor 'Release' @{ BDG_HOTRELOAD_TEST = '1' } 18
          if ($log -notmatch 'hot reload test: reloaded=1 kept=1 newcode=1 state=1 stopped=1') { $errors += 'C# hot reload test failed' }

          # 7-4 build: a new project with C# behaviours -> bdg build (pack, scripts, report, zip) -> the built player
          # runs the start scene for 90 frames and the behaviours with it (7-4b's broken-project check is a unit test)
          $game = Join-Path $env:RUNNER_TEMP 'bdg-game'
          Remove-Item -Recurse -Force $game -ErrorAction SilentlyContinue
          & "$PWD/build/Release/bdg.exe" new $game | Out-Null
          Add-Content -Encoding ascii "$game/Scenes/Main.scene" '{"id":"box","name":"Box","pos":[0,0.5,0],"MeshRenderer":{"mesh":"Cube"},"Spinner":{"speed":90},"LifecycleProbe":{}}'
          Push-Location $game
          $buildLog = & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" build --zip --scripts "$env:GITHUB_WORKSPACE/build/Release/Managed/Bidulgi.Samples.dll" | Out-String
          $buildExit = $LASTEXITCODE
          Pop-Location
          Write-Host $buildLog
          if ($buildExit -ne 0) { $errors += 'bdg build failed' }
          $built = "$game/Builds/Windows-Development"
          if (-not (Test-Path "$built/Content/game.bpak") -or -not (Test-Path "$built/build-report.txt") -or -not (Test-Path "$game/Builds/My Game-0.1.0-Development.zip")) { $errors += 'bdg build output incomplete' }
          Copy-Item "$env:GITHUB_WORKSPACE/mesa/x64/*.dll" "$built/" -Force # software OpenGL next to the built game (no GPU on the runner)
          $env:BDG_PLAYER_CACHE = Join-Path $env:RUNNER_TEMP 'bdg-game-cache'; $env:BDG_PLAYER_QUIET = '1'
          $p = Start-Process "$built/My Game.exe" -ArgumentList '--frames', 90 -PassThru -Wait
          Remove-Item Env:BDG_PLAYER_CACHE, Env:BDG_PLAYER_QUIET
          $plog = Get-Content "$built/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- built player (exit $($p.ExitCode))"; Write-Host $plog
          if ($p.ExitCode -ne 0 -or $plog -notmatch 'player: 90 frames, 1.50 s of game time, 2 C# behaviours, camera yes' -or $plog -notmatch 'probe: box .*update=90') { $errors += 'built game player failed' }

          # FPS template: bdg new --template fps (C# built by dotnet) -> the editor plays it in that folder with injected
          # input (walk, jump, shoot the first target: hit, pushed, score 1, look; the HUD score text and pixels change;
          # sparks fly, the best score 1 is saved to the default save folder %APPDATA%/My Studio/Range Test/Saves)
          # -> bdg build -> the built game runs it with its HUD and starts with the saved best score (6-5b)
          $fps = Join-Path $env:RUNNER_TEMP 'bdg-fps'
          Remove-Item -Recurse -Force $fps -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" new $fps --template fps --name 'Range Test' | Out-String | Write-Host
          if (-not (Test-Path "$fps/.cache/Scripts/RangeTest.dll")) { $errors += 'fps template: scripts not built' }
          $env:BDG_FPS_TEST = '1'; $env:BDG_AUDIO_NULL = '1'
          $p = Start-Process "$env:GITHUB_WORKSPACE/build/Release/BidulgiEditor.exe" -ArgumentList '--frames', 150 -WorkingDirectory $fps -PassThru -Wait
          Remove-Item Env:BDG_FPS_TEST
          $flog = Get-Content "$fps/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- fps template in the editor (exit $($p.ExitCode))"; Write-Host $flog
          if ($p.ExitCode -ne 0 -or $flog -notmatch 'fps test: play=1 moved=1 jumped=1 hit=1 pushed=1 look=1 hud=1 sparks=1 best=1') { $errors += 'fps template play test failed' }
          $fpsSave = "$env:APPDATA/My Studio/Range Test/Saves/main.save.json"
          if (-not (Test-Path $fpsSave) -or (Get-Content $fpsSave -Raw -Encoding utf8) -notmatch '"format":"bidulgi-save","version":1,"game":"Range Test".*"data":\{"best":1\}') { $errors += 'fps template: the best score is not in the default save folder' }
          Push-Location $fps
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" build | Out-String | Write-Host
          $fpsBuild = $LASTEXITCODE
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE/mesa/x64/*.dll" "$fps/Builds/Windows-Development/" -Force # software OpenGL next to the built game (no GPU on the runner)
          $env:BDG_PLAYER_CACHE = Join-Path $env:RUNNER_TEMP 'bdg-fps-cache'; $env:BDG_PLAYER_QUIET = '1'
          $p = Start-Process "$fps/Builds/Windows-Development/Range Test.exe" -ArgumentList '--frames', 120 -PassThru -Wait
          Remove-Item Env:BDG_PLAYER_CACHE, Env:BDG_PLAYER_QUIET, Env:BDG_AUDIO_NULL
          $fplog = Get-Content "$fps/Builds/Windows-Development/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- built fps game (exit $($p.ExitCode))"; Write-Host $fplog
          if ($fpsBuild -ne 0 -or $p.ExitCode -ne 0 -or $fplog -notmatch 'player: 120 frames, 2.00 s of game time, 20 C# behaviours, camera yes, ui elements 6' -or $fplog -notmatch 'physics: jolt 31 bodies') { $errors += 'fps template build / player failed' }
          if ($fplog -notmatch 'best score: 1') { $errors += 'fps template: the built game did not load the best score the editor run saved' }
          Remove-Item -Recurse -Force "$env:APPDATA/My Studio/Range Test" -ErrorAction SilentlyContinue
          # 2D platformer template: Box2D hero runs right through two coins, jumps, the camera follows, a click on the HUD's
          # help button reaches C#; build and run it (HUD in the built game)
          $plat = Join-Path $env:RUNNER_TEMP 'bdg-platformer'
          Remove-Item -Recurse -Force $plat -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" new $plat --template platformer2d --name 'Coin Run' | Out-String | Write-Host
          $env:BDG_PLATFORMER_TEST = '1'; $env:BDG_AUDIO_NULL = '1'
          $p = Start-Process "$env:GITHUB_WORKSPACE/build/Release/BidulgiEditor.exe" -ArgumentList '--frames', 76 -WorkingDirectory $plat -PassThru -Wait
          Remove-Item Env:BDG_PLATFORMER_TEST
          $plog = Get-Content "$plat/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- platformer template in the editor (exit $($p.ExitCode))"; Write-Host $plog
          if ($p.ExitCode -ne 0 -or $plog -notmatch 'platformer test: ran=1 jumped=1 coins=1 camera=1 button=1 hud=1') { $errors += 'platformer template play test failed' }
          Push-Location $plat
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" build | Out-String | Write-Host
          $platBuild = $LASTEXITCODE
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE/mesa/x64/*.dll" "$plat/Builds/Windows-Development/" -Force # software OpenGL next to the built game (no GPU on the runner)
          $env:BDG_PLAYER_CACHE = Join-Path $env:RUNNER_TEMP 'bdg-platformer-cache'; $env:BDG_PLAYER_QUIET = '1'
          $p = Start-Process "$plat/Builds/Windows-Development/Coin Run.exe" -ArgumentList '--frames', 90 -PassThru -Wait
          Remove-Item Env:BDG_PLAYER_CACHE, Env:BDG_PLAYER_QUIET, Env:BDG_AUDIO_NULL
          $pplog = Get-Content "$plat/Builds/Windows-Development/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- built platformer (exit $($p.ExitCode))"; Write-Host $pplog
          if ($platBuild -ne 0 -or $p.ExitCode -ne 0 -or $pplog -notmatch 'player: 90 frames, 1.50 s of game time, 13 C# behaviours, camera yes, ui elements 3' -or $pplog -notmatch 'box2d 20 bodies') { $errors += 'platformer template build / player failed' }
          # Third-person template (7-1b): generated humanoid with blend spaces and foot IK, follow camera; the editor plays it
          # with injected keys (walk, jump, run up the stairs, the camera stops at a wall, mouse look), then the built game
          $tp = Join-Path $env:RUNNER_TEMP 'bdg-thirdperson'
          Remove-Item -Recurse -Force $tp -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" new $tp --template thirdperson --name 'Hero Test' | Out-String | Write-Host
          if (-not (Test-Path "$tp/.cache/Scripts/HeroTest.dll") -or -not (Test-Path "$tp/Assets/Models/Hero.gltf")) { $errors += 'thirdperson template: scripts or model missing' }
          $env:BDG_THIRDPERSON_TEST = '1'; $env:BDG_AUDIO_NULL = '1'; $env:BDG_ASSETS = "$tp/Assets"
          $p = Start-Process "$env:GITHUB_WORKSPACE/build/Release/BidulgiEditor.exe" -ArgumentList '--frames', 180 -WorkingDirectory $tp -PassThru -Wait
          Remove-Item Env:BDG_THIRDPERSON_TEST, Env:BDG_ASSETS
          $tlog = Get-Content "$tp/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- thirdperson template in the editor (exit $($p.ExitCode))"; Write-Host $tlog
          if ($p.ExitCode -ne 0 -or $tlog -notmatch 'third person test: moved=1 walk=1 run=1 jump=1 footik=1 hud=1 collide=1 look=1') { $errors += 'thirdperson template play test failed' }
          Push-Location $tp
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" build | Out-String | Write-Host
          $tpBuild = $LASTEXITCODE
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE/mesa/x64/*.dll" "$tp/Builds/Windows-Development/" -Force # software OpenGL next to the built game (no GPU on the runner)
          $env:BDG_PLAYER_CACHE = Join-Path $env:RUNNER_TEMP 'bdg-thirdperson-cache'; $env:BDG_PLAYER_QUIET = '1'
          $p = Start-Process "$tp/Builds/Windows-Development/Hero Test.exe" -ArgumentList '--frames', 120 -PassThru -Wait
          Remove-Item Env:BDG_PLAYER_CACHE, Env:BDG_PLAYER_QUIET, Env:BDG_AUDIO_NULL
          $tplog = Get-Content "$tp/Builds/Windows-Development/Bidulgi.log" -Raw -Encoding utf8
          Write-Host "----- built thirdperson game (exit $($p.ExitCode))"; Write-Host $tplog
          if ($tpBuild -ne 0 -or $p.ExitCode -ne 0 -or $tplog -notmatch 'player: 120 frames, 2.00 s of game time, 2 C# behaviours, camera yes, ui elements 3' -or $tplog -notmatch 'animation: stopped \(1 animators') { $errors += 'thirdperson template build / player failed' }

          # Round 7 multiplayer arena template: bdg new --template arena -> bdg build -> the built game as a dedicated server
          # (--server, no window) and two clients (--connect, 5 % loss): both join, get their players, and the server's
          # replicated round clock reaches them. The quit clocks start at the join (clients) and when both players are in
          # (server: --expect-players), so slow software-GL starts cannot end the match early; --timeout is the hard limit
          $ar = Join-Path $env:RUNNER_TEMP 'bdg-arena'
          Remove-Item -Recurse -Force $ar -ErrorAction SilentlyContinue
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" new $ar --template arena --name 'Arena Test' | Out-String | Write-Host
          if (-not (Test-Path "$ar/.cache/Scripts/ArenaTest.dll")) { $errors += 'arena template: scripts not built' }
          Push-Location $ar
          & "$env:GITHUB_WORKSPACE/build/Release/bdg.exe" build | Out-String | Write-Host
          $arenaBuild = $LASTEXITCODE
          Pop-Location
          Copy-Item "$env:GITHUB_WORKSPACE/mesa/x64/*.dll" "$ar/Builds/Windows-Development/" -Force # software OpenGL next to the built game (no GPU on the runner)
          $aexe = "$ar/Builds/Windows-Development/Arena Test.exe"
          $env:BDG_PLAYER_CACHE = Join-Path $env:RUNNER_TEMP 'bdg-arena-cache'; $env:BDG_PLAYER_QUIET = '1'; $env:BDG_HIDDEN = '1'; $env:BDG_AUDIO_NULL = '1'
          $srv = Start-Process $aexe -ArgumentList '--server', '--port', 47811, '--expect-players', 2, '--quit-after', 8, '--timeout', 170, '--log', "$ar/server.log" -PassThru
          Start-Sleep -Seconds 3
          $c1 = Start-Process $aexe -ArgumentList '--connect', '127.0.0.1:47811', '--name', 'Ann', '--sim-loss', 5, '--quit-after', 8, '--timeout', 160, '--log', "$ar/client1.log" -PassThru
          $c2 = Start-Process $aexe -ArgumentList '--connect', '127.0.0.1:47811', '--name', 'Bo', '--sim-loss', 5, '--quit-after', 8, '--timeout', 160, '--log', "$ar/client2.log" -PassThru
          $srv, $c1, $c2 | Wait-Process -Timeout 200 -ErrorAction SilentlyContinue
          $srv, $c1, $c2 | Where-Object { -not $_.HasExited } | Stop-Process -Force
          Remove-Item Env:BDG_PLAYER_CACHE, Env:BDG_PLAYER_QUIET, Env:BDG_HIDDEN, Env:BDG_AUDIO_NULL
          $slog = Get-Content "$ar/server.log" -Raw -Encoding utf8
          $clogs = @("$ar/client1.log", "$ar/client2.log") | ForEach-Object { Get-Content $_ -Raw -Encoding utf8 -ErrorAction SilentlyContinue }
          Write-Host "----- arena dedicated server (exit $($srv.ExitCode))"; Write-Host $slog
          $clogs | ForEach-Object { Write-Host '----- arena client'; Write-Host $_ }
          # the two clients start together, so either may join first: Ann and Bo each as player 1 or 2, not the same number
          $annN = if ($slog -match 'player (\d+) "Ann" joined') { [int]$Matches[1] } else { 0 }
          $boN = if ($slog -match 'player (\d+) "Bo" joined') { [int]$Matches[1] } else { 0 }
          $joined = ($annN -in 1, 2) -and ($boN -in 1, 2) -and ($annN -ne $boN)
          if ($arenaBuild -ne 0 -or $srv.ExitCode -ne 0 -or $slog -notmatch 'server: Arena Test on port 47811' -or -not $joined -or
              $slog -notmatch 'server: \d+ ticks, 2 player\(s\) at most') { $errors += "arena dedicated server failed (Ann joined as $annN, Bo as $boN)" }
          foreach ($c in $clogs) {
            if ($c -notmatch 'net: joined as player [12]' -or $c -notmatch 'arena: round clock \d+ s from the server') { $errors += 'arena client failed' }
          }
          # E-9 camera shake: a near source shakes the game camera in play mode, a far one does not, Camera.Shake node
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_SHAKE_TEST = '1' } 80
          if ($log -notmatch 'shake test: start=1 moves=1 ends=1 node=1 stop=1') { $errors += 'camera shake test failed' }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          # 28) 3-5b cascaded shadows: medium (one map) vs high (3 cascades): sharper near edge, shadows at 73 m, cascade view
          #     3-4b point / spot shadows: a spot tile and point cube faces darken the ground behind boxes, tier light limits
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-shadows'; BDG_RENDER_TEST = '1' } 5
          if ($log -notmatch 'shadow test: .*cascades=ok near=ok far=ok blob=ok local=ok local_tiers=ok result=pass') { $errors += 'cascaded / blob / point-spot shadow test failed' }
          if ($log -match '(shadow test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 29) 3-5b SSAO: open flat surfaces stay unoccluded, a box's foot and an inside corner darken, only on high
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-ao'; BDG_RENDER_TEST = '1' } 5
          if ($log -notmatch 'ao test: .*flat=ok contact=ok tiers=ok aniso=ok grading=ok result=pass') { $errors += 'SSAO / anisotropy / grading test failed' }
          if ($log -match '(ao test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 30) 3-5b Forward+: 256 lights, cluster lists give the same picture as every light per pixel
          $log = Invoke-Editor 'Release' @{ BDG_SCREEN = 'render-lights'; BDG_RENDER_TEST = '1' } 5
          if ($log -notmatch 'lights test: .*same=ok lights=ok lists=ok result=pass') { $errors += 'Forward+ test failed' }
          if ($log -match '(lights test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          # 3-5c quality automation: device benchmark -> tier (cached per GPU), frame drop steps down, texture groups per tier
          Remove-Item -Recurse -Force "$PWD/ci-autoq-assets" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$PWD/ci-autoq-assets" | Out-Null
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_AUTOQ_TEST = '1'; BDG_ASSETS = "$PWD/ci-autoq-assets" } 8
          if ($log -notmatch 'autoq test: bench=1 cached=1 tier=\w+ ms=[\d.]+ governor=1 groups=1') { $errors += 'quality automation test failed' }
          if ($log -match '(autoq test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue
          # 3-8b indoor composite scene (generated, CC0): every material / texture group loads, light and shadow limits,
          # a point light shadow in the side room and the window piers' sun shadow
          python tools/make_indoor_scene.py
          git diff --exit-code -- Tests/IndoorScene
          if ($LASTEXITCODE -ne 0) { $errors += 'Tests/IndoorScene is out of date: run tools/make_indoor_scene.py' }
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          $log = Invoke-Editor 'Release' @{ BDG_ASSETS = "$PWD/Tests/IndoorScene/Assets"; BDG_SCENE_FILE = "$PWD/Tests/IndoorScene/Assets/Scenes/Cloister.scene"; BDG_INDOOR_TEST = '1' } 16
          if ($log -notmatch 'indoor test: objects=74 materials=10/10 textures=6,4,2 .* textures=ok lights=ok room=ok sun=ok') { $errors += 'indoor scene test failed' }
          if ($log -match '(indoor test: [^\r\n]*)') { Write-Host "::notice::$($Matches[1])" }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue
          # 3-9b image regression: every bookmark of both test scenes at 480x270 against the committed baselines of this
          # renderer (Tests/RenderBaselines/software here). Missing baselines are a notice, not a failure: the pictures are
          # uploaded as the render-regression artifact; copy them into Tests/RenderBaselines/software/<scene>/ to accept them.
          Remove-Item -Recurse -Force "$PWD/ci-regress" -ErrorAction SilentlyContinue
          $env:BDG_LAYOUT = "$PWD/ci-layout-none.jsonl"
          foreach ($s in @(@('RenderReference', 'RenderReference'), @('IndoorScene', 'Cloister'))) {
            $a = "$PWD/Tests/$($s[0])/Assets"
            $log = Invoke-Editor 'Release' @{ BDG_ASSETS = $a; BDG_SCENE_FILE = "$a/Scenes/$($s[1]).scene"; BDG_RENDER_COMPARE = 'repo'; BDG_COMPARE_OUT = "$PWD/ci-regress/$($s[1])" } 42
            if ($log -notmatch 'compare summary: compared=\d+ created=0 failed=0 .* missing=\d+ renderer=\S+') { $errors += "image regression failed: $($s[1]) (see the render-regression artifact)" }
            if ($log -match 'missing=([1-9]\d*) renderer=(\S+)') { Write-Host "::notice::$($s[1]): $($Matches[1]) bookmark(s) have no $($Matches[2]) baseline yet; pictures are in the render-regression artifact" }
            if ($log -match '(compare summary: [^\r\n]*)') { Write-Host "::notice::$($s[1]) $($Matches[1])" }
          }
          Remove-Item Env:BDG_LAYOUT -ErrorAction SilentlyContinue

          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'All smoke tests passed.'

      - name: Upload render regression pictures (3-9b)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-regression
          path: ci-regress
          if-no-files-found: ignore

      - name: Unit tests
        shell: pwsh
        run: |
          build/Release/BidulgiTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Design parity (tokens + layout vs design-system previews)
        shell: pwsh
        env:
          MESA_GL_VERSION_OVERRIDE: '4.5'
          MESA_GLSL_VERSION_OVERRIDE: '450'
          GALLIUM_DRIVER: llvmpipe
          PYTHONIOENCODING: utf-8
        run: python tools/ui_compare/compare.py --exe build/Release/BidulgiEditor.exe

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: |
            ci-editor.png
            Bidulgi.log
            build-*.log
            BugReports/
          if-no-files-found: ignore

  asan:
    name: Unit tests + fuzzing under AddressSanitizer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-asan-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure (BDG_ASAN=ON)
        run: cmake -S . -B build-asan -A x64 -DBDG_ASAN=ON

      - name: Build tests
        run: cmake --build build-asan --config Release --target BidulgiTests -- /m /v:minimal

      - name: Run tests (ASan runtime from the MSVC toolset)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dll = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" | Sort-Object FullName | Select-Object -Last 1
          $env:PATH = "$($dll.DirectoryName);$env:PATH"
          build-asan/Release/BidulgiTests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
