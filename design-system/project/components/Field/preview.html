<div class="bdg bdg-panel" data-bdg-id="field.root" style="max-width:360px;border-radius:0">
  <div class="bdg-comp-head" data-bdg-id="field.head.transform">Transform</div>
  <div class="bdg-row" data-bdg-id="field.position"><label>Position</label><div class="bdg-vec"><span class="bdg-axis x"><b>X</b><input class="bdg-input" aria-label="Position X" value="-4"></span><span class="bdg-axis y"><b>Y</b><input class="bdg-input" aria-label="Position Y" value="1.6"></span><span class="bdg-axis z"><b>Z</b><input class="bdg-input" aria-label="Position Z" value="0"></span></div></div>
  <div class="bdg-comp-head" data-bdg-id="field.head.widget">Widget</div>

  <div class="bdg-row" data-bdg-id="field.space"><label for="f-space">Space</label><select class="bdg-input" id="f-space"><option>Screen</option><option selected>World</option><option>Camera</option></select></div>
  <div class="bdg-row" data-bdg-id="field.interactive"><label for="f-int">Interactive</label><input type="checkbox" class="bdg-check" id="f-int" checked></div>

</div>
