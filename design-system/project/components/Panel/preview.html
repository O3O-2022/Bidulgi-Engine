<!-- @dsCard group="Layout" height=220 subtitle="Header tabs, caption, rows" -->
<div class="bdg" data-bdg-id="panel.root" style="background:var(--line);padding:1px;display:grid;grid-template-columns:1fr 1fr;gap:1px;max-width:640px">
  <section class="bdg-panel" style="border:0;border-radius:0" data-bdg-id="panel.hierarchy">
    <div class="bdg-panel-head" role="tablist"><button class="bdg-tab" role="tab" aria-selected="true">Hierarchy</button><button class="bdg-tab" role="tab" aria-selected="false">Search</button></div>
    <div class="bdg-panel-body"><div class="bdg-caption" data-bdg-id="panel.caption">Scene</div>
      <ul class="bdg-list"><li class="bdg-li" data-bdg-id="panel.camera"><i class="bdg-kind camera"></i>Main Camera<span class="bdg-type">Camera</span></li><li class="bdg-li" aria-selected="true" data-bdg-id="panel.sign"><i class="bdg-kind widget"></i>Shop Sign<span class="bdg-type">Widget</span></li></ul></div>
  </section>
  <section class="bdg-panel" style="border:0;border-radius:0" data-bdg-id="panel.inspector">
    <div class="bdg-panel-head" role="tablist"><button class="bdg-tab" role="tab" aria-selected="true">Inspector</button><button class="bdg-tab" role="tab" aria-selected="false">Text</button></div>
    <div class="bdg-panel-body"><div class="bdg-row" data-bdg-id="panel.name"><label for="p-name">Name</label><input class="bdg-input" id="p-name" value="Shop Sign"></div><div class="bdg-row" data-bdg-id="panel.space"><label for="p-space">Space</label><select class="bdg-input" id="p-space"><option>World</option></select></div></div>
  </section>
</div>
