<!-- @dsCard height=300 -->
<div class="cover" data-bdg-id="cover.root">
  <style>
    .cover{position:relative;width:960px;height:300px;background:var(--ground);overflow:hidden;font-family:var(--font-sans)}
    .cover svg{position:absolute;left:0;top:0}
    .cv-raise{fill:var(--raise)}
    .cv-dot{fill:var(--line-strong)}
    .cv-win{fill:var(--win)}
    .cv-stripe{fill:var(--node-function)}
    .cv-sel{fill:var(--selection)}
    .cv-accent{fill:var(--accent)}
    .cv-tile{rx:var(--radius-md)}
    .cover .name{position:absolute;left:40px;bottom:64px;margin:0;max-width:440px;font-size:96px;line-height:.95;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
    .cover .tag{position:absolute;left:40px;bottom:32px;margin:0;max-width:440px;font-size:13px;color:var(--fg-dim)}
  </style>
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!--
      blocks: raise canvas 480x300, win node 176x88 with node-function 3px stripe, selection 176x110, accent slab 96x220 (radius-md corners)
      arrangement: one canvas field bleeding off top, right and bottom, a node and a selected block stacked left of a tall accent slab
      pattern: dot grid, the graph editor canvas; chosen because the system calls itself a dense, precise editor on a 16px canvas grid
      steps and radii: dot pitch space-8 (16px), gaps space-6 (12px) and space-8, corners radius-md
    -->
    <rect x="480" y="0" width="480" height="300" class="cv-raise"/>
    <g id="dots"></g>
    <rect x="560" y="40" width="176" height="88" class="cv-win cv-tile"/>
    <rect x="560" y="40" width="176" height="3" class="cv-stripe"/>
    <rect x="560" y="144" width="176" height="110" class="cv-sel cv-tile"/>
    <rect x="752" y="40" width="96" height="220" class="cv-accent cv-tile"/>
  </svg>
  <h1 class="name" data-bdg-id="cover.name">Bidulgi<br>Editor</h1>
  <p class="tag" data-bdg-id="cover.tag">AI와 사람이 같은 방식으로 다루는 게임 엔진 에디터</p>
  <script>
    (function(){var g=document.getElementById('dots'),ns='http://www.w3.org/2000/svg';
      for(var y=48;y<=248;y+=16){for(var x=872;x<=920;x+=16){var c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',1.4);c.setAttribute('class','cv-dot');g.appendChild(c);}}})();
  </script>
</div>
