<!-- @dsCard group="Graph" height=170 subtitle="Graph, Anim Graph and Material graph nodes" -->
<div class="bdg" style="background:var(--panel);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px;padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
  <div class="bdg-node event"><div class="bdg-node-head">Event Update</div><div class="bdg-node-pins"><div class="bdg-pins in"></div><div class="bdg-pins out"><span class="bdg-pin"><i class="exec"></i></span><span class="bdg-pin" style="--pin-c:var(--pin-float)"><i></i>Delta Time</span></div></div></div>
  <div class="bdg-node pure"><div class="bdg-node-head">Distance <small>Vector</small></div><div class="bdg-node-pins"><div class="bdg-pins in"><span class="bdg-pin" style="--pin-c:var(--pin-vector)"><i></i>A</span><span class="bdg-pin" style="--pin-c:var(--pin-vector)"><i></i>B</span></div><div class="bdg-pins out"><span class="bdg-pin" style="--pin-c:var(--pin-float)"><i></i></span></div></div></div>
  <div class="bdg-node function" aria-selected="true"><div class="bdg-node-head">Move Towards <small>Transform</small></div><div class="bdg-node-pins"><div class="bdg-pins in"><span class="bdg-pin"><i class="exec"></i></span><span class="bdg-pin" style="--pin-c:var(--pin-vector)"><i></i>Target</span><span class="bdg-pin" style="--pin-c:var(--pin-float)"><i></i>Speed <span class="bdg-lit">2.0</span></span></div><div class="bdg-pins out"><span class="bdg-pin"><i class="exec"></i></span></div></div></div>
  <div class="bdg-node"><div class="bdg-node-head">Branch</div><div class="bdg-node-pins"><div class="bdg-pins in"><span class="bdg-pin"><i class="exec"></i></span><span class="bdg-pin" style="--pin-c:var(--pin-bool)"><i></i>Condition</span></div><div class="bdg-pins out"><span class="bdg-pin"><i class="exec"></i>True</span><span class="bdg-pin"><i class="exec"></i>False</span></div></div></div>
</div>
