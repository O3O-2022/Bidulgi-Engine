<title>Quality Tiers Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one viewport canvas with a tier switcher above and a spec panel beside it (stacks on phones).
   Single dark look on purpose: it mirrors the editor. */
:root{color-scheme:dark;--ground:#0b0d10;--win:#14171b;--panel:#1a1d22;--raise:#23272d;--line:#2a2f36;--line2:#3a4049;
  --fg:#e3e6ea;--dim:#9aa1ab;--faint:#6f7782;--accent:#e9a23b;--on-accent:#1b1306;--ok:#72c04e;--warn:#e6c057;
  --sans:'Inter',system-ui,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font:15px/1.55 var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--dim);font-size:14px;margin-left:8px}
.note{color:var(--faint);font-size:13px;margin:4px 0 0}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.tiers button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--dim);font:600 15px var(--sans);cursor:pointer}
.tiers button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tiers button:focus-visible,.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.view{position:relative;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.view canvas{display:block;width:100%!important;height:100%!important}
.view.pix canvas{image-rendering:pixelated}
.hud{position:absolute;left:10px;top:8px;font:500 12px/1.5 var(--mono);color:#dfe4ea;text-shadow:0 1px 2px #000;pointer-events:none}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--dim)}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.spec h2{margin:0;font-size:18px}
.spec .def{color:var(--dim);margin:0;font-size:14px}
.spec dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.spec dt{color:var(--faint)}.spec dd{margin:0}
.tog{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--dim);cursor:pointer}
.tog input{accent-color:var(--accent);width:18px;height:18px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
</style>

<div class="wrap">
  <div>
    <h1>품질 단계 미리보기 <small>같은 맵 · 5단계</small></h1>
    <p class="note">브라우저 WebGL로 각 단계의 차이를 흉내 낸 시안입니다. 실제 엔진의 렌더러나 Halo GI 결과가 아닙니다. 드래그로 회전, 휠로 확대합니다.</p>
  </div>
  <div class="tiers" role="group" aria-label="품질 단계">
    <button type="button" data-t="0">감자</button><button type="button" data-t="1">저사양</button><button type="button" data-t="2" aria-pressed="true">중사양</button><button type="button" data-t="3">고사양</button><button type="button" data-t="4">초고사양</button>
  </div>
  <div class="main">
    <div class="view" id="view"><div class="hud" id="hud"></div></div>
    <aside class="spec" aria-live="polite">
      <h2 id="sName"></h2>
      <p class="def" id="sDef"></p>
      <dl id="sList"></dl>
      <label class="tog"><input type="checkbox" id="spin" checked>자동 회전</label>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(() => {
const view = document.getElementById('view'), hud = document.getElementById('hud');
if (!window.THREE) { view.insertAdjacentHTML('beforeend', '<div class="err">3D 라이브러리를 불러오지 못했습니다. 새로고침해 보세요.</div>'); return; }
const T = THREE;
const TIERS = [
  { name:'감자', def:'그래픽 연산을 거의 쓰지 않습니다. 조명·그림자 없이 색만 칠합니다.', list:[['대상','아주 오래된 기기, 웹'],['목표','60fps'],['조명','없음 (Unlit)'],['그림자','없음'],['GI','없음'],['반투명','단순 투명도'],['후처리','없음'],['해상도','0.6배 (픽셀이 보임)']] },
  { name:'저사양', def:'옛날 기기에서도 돌아갑니다. 정점 단위 조명과 바닥 그림자만 씁니다.', list:[['대상','7~8년 된 휴대폰, 내장 그래픽'],['목표','30fps 이상'],['조명','정점 라이팅, 라이트 2개'],['그림자','바닥 동그란 그림자(블롭)'],['GI','저해상도 라이트맵 (주변광으로 흉내)'],['반투명','단순 투명도'],['후처리','없음'],['해상도','0.75배']] },
  { name:'중사양', def:'모든 플랫폼에서 안정적으로 돌아가는 기본 단계입니다.', list:[['대상','보급형 휴대폰, 일반 PC, 웹'],['목표','30~60fps 안정'],['조명','PBR 픽셀 라이팅, 라이트 4개'],['그림자','태양 그림자 1단계'],['GI','Tier 0: 라이트맵 + 프로브 (반구광으로 흉내)'],['반투명','PBR 투명'],['후처리','톤매핑'],['해상도','1배']] },
  { name:'고사양', def:'여러 플랫폼에서 30~60fps 이상, 그래픽도 좋습니다.', list:[['대상','최신 중급 휴대폰, 게이밍 PC'],['목표','60fps (모바일 30fps 이상)'],['조명','다수 (클러스터)'],['그림자','부드러운 그림자, 고해상도'],['GI','Tier 1: 동적 프로브 (환경광 반사로 흉내)'],['반투명','PBR 투명 + 반사'],['후처리','톤매핑, Bloom, 안개'],['해상도','최대 1.5배']] },
  { name:'초고사양', def:'루멘급 실시간 GI를 목표로 하는 최고 단계입니다.', list:[['대상','고사양 PC, 레이 트레이싱 GPU'],['목표','30~60fps'],['조명','다수 + 반사광(빛 번짐) 보조광'],['그림자','최고 해상도, 점광원 그림자'],['GI','Tier 2~3 (색 번짐 보조광으로 흉내)'],['반투명','클리어코트 유리'],['후처리','강한 Bloom, 빛줄기, 안개'],['해상도','기기 최대']] },
];

// renderer, scene, camera
const renderer = new T.WebGLRenderer({ antialias:true });
renderer.outputEncoding = T.sRGBEncoding;
view.prepend(renderer.domElement);
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(50, 16/9, 0.1, 200);
camera.position.set(11, 7.5, 13);
const controls = new T.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 6; controls.maxDistance = 30;
let pmremEnv = null;
try { if (T.RoomEnvironment) { const pm = new T.PMREMGenerator(renderer); pmremEnv = pm.fromScene(new T.RoomEnvironment(), 0.04).texture; } } catch (e) {}

// scene objects carry a spec; materials are rebuilt per tier
const objs = [];
function add(geo, spec, pos, rot, scale){
  const m = new T.Mesh(geo, new T.MeshBasicMaterial());
  m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scale) m.scale.set(...scale);
  m.userData.spec = spec; scene.add(m); objs.push(m); return m;
}
const S = (color, o = {}) => Object.assign({ color, rough:0.8, metal:0 }, o);
add(new T.PlaneGeometry(44, 44), S(0x4a5240, { rough:0.95 }), [0,0,0], [-Math.PI/2,0,0]).userData.ground = true;
// cave (dark area) on the left
const rock = S(0x5a5550, { rough:1 });
add(new T.BoxGeometry(0.8, 4, 8), rock, [-9, 2, 0]);
add(new T.BoxGeometry(0.8, 4, 8), rock, [-5, 2, 0]);
add(new T.BoxGeometry(4.8, 0.8, 8), rock, [-7, 4.4, 0]);
add(new T.BoxGeometry(4.8, 4, 0.8), rock, [-7, 2, -4]);
add(new T.BoxGeometry(1.2, 0.81, 1.2), S(0x000000), [-7, 4.4, 1.2]); // roof hole (sky shows through)
const crystals = [];
[[-8, 0.7, -2.4, 0x3fd7ff], [-6, 0.5, -1.2, 0x7a6bff], [-7.6, 0.6, 1.6, 0x3fd7ff]].forEach(([x,y,z,c], i) => {
  crystals.push(add(new T.OctahedronGeometry(0.55 + i * 0.1), S(c, { emissive:c, rough:0.2, glow:true }), [x,y,z], [0, i, 0.3], [0.7, 1.6, 0.7]));
});
// glass panes (translucent)
[[-1.6, 0x7fd0ff], [0, 0xff8fb0], [1.6, 0xa8ff9a]].forEach(([x, c], i) => add(new T.BoxGeometry(1.2, 2.4, 0.08), S(c, { glass:true, rough:0.05 }), [x, 1.3, -2 + i * 0.4], [0, 0.25, 0]));
// spheres: chrome, gold, clay
add(new T.SphereGeometry(0.9, 48, 32), S(0xdfe3e8, { metal:1, rough:0.08 }), [-1.8, 0.9, 2.6]);
add(new T.SphereGeometry(0.9, 48, 32), S(0xf0b44a, { metal:1, rough:0.3 }), [0.4, 0.9, 3.2]);
add(new T.SphereGeometry(0.9, 48, 32), S(0xc76a4a, { rough:0.9 }), [2.6, 0.9, 2.4]);
// pond
add(new T.CircleGeometry(3.2, 48), S(0x1d5a7a, { metal:0.2, rough:0.05, water:true }), [6.5, 0.02, -1], [-Math.PI/2, 0, 0]);
// lantern
add(new T.CylinderGeometry(0.08, 0.1, 3, 8), S(0x2c2a28, { metal:0.6, rough:0.5 }), [3.6, 1.5, -4.5]);
const lamp = add(new T.SphereGeometry(0.32, 24, 16), S(0xffa340, { emissive:0xffa340, glow:true }), [3.6, 3.1, -4.5]);
// trees
[[8, -6], [10, 2], [-2, -8], [5.5, 6.5]].forEach(([x, z]) => {
  add(new T.CylinderGeometry(0.18, 0.25, 1.6, 8), S(0x5b3d27), [x, 0.8, z]);
  add(new T.ConeGeometry(1.1, 2.8, 10), S(0x2f6b3a), [x, 2.9, z]);
});
// blob shadows (low tier)
const blobs = [];
const blobMat = new T.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.35, depthWrite:false });
[[-1.8, 2.6, 1], [0.4, 3.2, 1], [2.6, 2.4, 1], [8, -6, 1.2], [10, 2, 1.2], [-2, -8, 1.2], [5.5, 6.5, 1.2], [3.6, -4.5, 0.4]].forEach(([x, z, r]) => {
  const b = new T.Mesh(new T.CircleGeometry(r, 24), blobMat); b.rotation.x = -Math.PI/2; b.position.set(x, 0.015, z); scene.add(b); blobs.push(b);
});
// light shafts through the cave roof (ultra)
const shaft = new T.Mesh(new T.CylinderGeometry(0.5, 1.4, 4.4, 24, 1, true), new T.MeshBasicMaterial({ color:0xfff2d0, transparent:true, opacity:0.09, blending:T.AdditiveBlending, depthWrite:false, side:T.DoubleSide }));
shaft.position.set(-7, 2.2, 1.2); scene.add(shaft);

// lights
const sun = new T.DirectionalLight(0xfff1dc, 2.2); sun.position.set(8, 14, 6); scene.add(sun);
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16; sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16; sun.shadow.camera.far = 50; sun.shadow.bias = -0.0005;
const hemi = new T.HemisphereLight(0xa9c8ff, 0x3a3226, 0.6); scene.add(hemi);
const amb = new T.AmbientLight(0xffffff, 0.35); scene.add(amb);
const lampLight = new T.PointLight(0xffa340, 2.2, 10, 2); lampLight.position.copy(lamp.position); scene.add(lampLight);
const crystalLights = crystals.map(c => { const l = new T.PointLight(c.userData.spec.emissive, 1.6, 5, 2); l.position.copy(c.position).add(new T.Vector3(0, 0.6, 0)); scene.add(l); return l; });
const bounce = [new T.PointLight(0x3fbfff, 0.5, 7, 2), new T.PointLight(0xffa060, 0.5, 6, 2), new T.PointLight(0x9fd890, 0.3, 6, 2)];
bounce[0].position.set(-7, 0.4, 0); bounce[1].position.set(3.6, 0.5, -4); bounce[2].position.set(0, 0.3, 1); bounce.forEach(b => scene.add(b));

// post processing
let composer = null, bloom = null;
function size(){
  const w = view.clientWidth, h = view.clientHeight || w * 9 / 16;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setSize(w, h); }
}

function material(spec, tier){
  const opts = { color:spec.color };
  if (tier === 0) {
    const m = new T.MeshBasicMaterial(opts);
    if (spec.glass) { m.transparent = true; m.opacity = 0.45; }
    return m;
  }
  if (tier === 1) {
    const m = new T.MeshLambertMaterial(opts);
    if (spec.emissive) m.emissive = new T.Color(spec.emissive);
    if (spec.glass) { m.transparent = true; m.opacity = 0.45; }
    return m;
  }
  const P = tier === 4 ? T.MeshPhysicalMaterial : T.MeshStandardMaterial;
  const m = new P({ color:spec.color, roughness:spec.rough, metalness:spec.metal });
  if (spec.emissive) { m.emissive = new T.Color(spec.emissive); m.emissiveIntensity = tier >= 3 ? 2.2 : 1; }
  if (spec.glass) { m.transparent = true; m.opacity = tier === 4 ? 0.28 : 0.4; m.depthWrite = false; if (tier === 4) { m.clearcoat = 1; m.clearcoatRoughness = 0.05; } }
  if (spec.water && tier >= 3) { m.roughness = 0.02; m.metalness = 0.5; }
  if (tier === 4 && spec.metal === 1) { m.clearcoat = 0.6; }
  if (tier >= 3 && pmremEnv) m.envMapIntensity = tier === 4 ? 1.2 : 0.8;
  return m;
}

let tier = 2, pixel = 1;
function applyTier(t){
  tier = t;
  document.querySelectorAll('[data-t]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.t === t)));
  const info = TIERS[t];
  document.getElementById('sName').textContent = info.name;
  document.getElementById('sDef').textContent = info.def;
  document.getElementById('sList').innerHTML = info.list.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  view.classList.toggle('pix', t === 0);

  pixel = [0.6, 0.75, 1, Math.min(devicePixelRatio, 1.5), devicePixelRatio][t];
  renderer.setPixelRatio(pixel);
  renderer.toneMapping = t >= 2 ? T.ACESFilmicToneMapping : T.NoToneMapping;
  renderer.toneMappingExposure = t === 4 ? 1.05 : 1;
  renderer.shadowMap.enabled = t >= 2;
  renderer.shadowMap.type = t >= 3 ? T.PCFSoftShadowMap : T.PCFShadowMap;

  objs.forEach(o => {
    o.material.dispose(); o.material = material(o.userData.spec, t);
    o.castShadow = t >= 2 && !o.userData.ground && !o.userData.spec.water;
    o.receiveShadow = t >= 2;
  });
  blobs.forEach(b => b.visible = t === 1);
  shaft.visible = t === 4;

  scene.environment = t >= 3 ? pmremEnv : null;
  scene.background = new T.Color([0x9fb6cc, 0x8fa6bf, 0x7f9fc4, 0x6f93c0, 0x5d86b8][t]);
  scene.fog = t >= 3 ? new T.Fog(scene.background.getHex(), t === 4 ? 18 : 22, t === 4 ? 60 : 70) : null;

  sun.visible = t >= 1; sun.intensity = t === 1 ? 1.2 : 2.2;
  sun.castShadow = t >= 2;
  const ms = [0, 0, 1024, 2048, 4096][t];
  if (ms && sun.shadow.mapSize.x !== ms) { sun.shadow.mapSize.set(ms, ms); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  sun.shadow.radius = t >= 3 ? 4 : 1;
  hemi.visible = t >= 2; hemi.intensity = t === 2 ? 0.7 : 0.45;
  amb.visible = t === 1; amb.intensity = 0.5;
  lampLight.visible = t >= 1;
  lampLight.castShadow = t === 4; lampLight.shadow.mapSize.set(1024, 1024);
  crystalLights.forEach((l, i) => l.visible = t >= 3 || (t === 2 && i === 0));
  bounce.forEach(b => b.visible = t === 4);

  if (t >= 3 && T.EffectComposer && T.UnrealBloomPass) {
    if (!composer) {
      composer = new T.EffectComposer(renderer);
      composer.addPass(new T.RenderPass(scene, camera));
      bloom = new T.UnrealBloomPass(new T.Vector2(512, 288), 0.6, 0.5, 0.85);
      composer.addPass(bloom);
    }
    composer.setPixelRatio(pixel);
    bloom.strength = t === 4 ? 0.95 : 0.55; bloom.radius = t === 4 ? 0.7 : 0.45; bloom.threshold = t === 4 ? 0.7 : 0.85;
  }
  size();
}
document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => applyTier(+b.dataset.t)));
const spin = document.getElementById('spin');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) spin.checked = false;
spin.addEventListener('change', () => controls.autoRotate = spin.checked);
controls.autoRotate = spin.checked;
new ResizeObserver(size).observe(view);

let last = performance.now(), fps = 60, n = 0;
function frame(now){
  const dt = (now - last) / 1000; last = now; fps = fps * 0.92 + (1 / Math.max(dt, 0.001)) * 0.08;
  controls.update();
  crystals.forEach((c, i) => c.rotation.y += dt * (0.3 + i * 0.1));
  if (tier >= 3 && composer) composer.render(); else renderer.render(scene, camera);
  if (++n % 12 === 0) { const r = renderer.info.render; hud.textContent = `${TIERS[tier].name} · ${Math.round(fps)} fps · Draw ${r.calls} · Tris ${(r.triangles / 1000).toFixed(1)}k`; }
  requestAnimationFrame(frame);
}
renderer.info.autoReset = true;
applyTier(2);
requestAnimationFrame(frame);
})();
</script>
